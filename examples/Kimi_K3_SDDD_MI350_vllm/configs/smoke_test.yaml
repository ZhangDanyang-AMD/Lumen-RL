# Kimi K3 DSpark Smoke Test — MI350 (vLLM, Batch-Alternating)
#
# Full-pipeline 5-step validation: vLLM prefills dataset sequences
# (TP=8), extracts hidden states via Mooncake → SHM, shuts down,
# then trains DSpark draft on cached hidden states.
#
# Batch-alternating mode:
#   Phase A: GPUs 0-7 — vLLM teacher prefill (TP=8, MXFP4)
#   Phase B: GPUs 0-7 — torchrun replicate draft training (BF16)
#
# Usage:
#   bash examples/Kimi_K3_SDDD_MI350_vllm/run_kimi_k3.sh --smoke-test

cluster:
  gpus_per_node: 8
  num_nodes: 1

policy:
  model_name: /dev/shm/Kimi-K3
  training_backend: fsdp2
  generation_backend: hf
  max_total_sequence_length: 2048
  train_global_batch_size: 8
  train_micro_batch_size: 1
  learning_rate: 6e-4
  weight_decay: 0.0
  max_grad_norm: 1.0
  warmup_ratio: 0.0

algorithm:
  name: spec_distill
  spec_distill:
    draft_type: dspark
    loss_type: dspark
    sequential_mode: batch_alternating
    cache_batches: 5
    cache_dir: /tmp/teacher_cache_smoke
    loss_decay_gamma: 4.0
    num_target_layers: 5
    spec_length: 7
    aux_hidden_state_layer_ids: [2, 23, 47, 71, 89]
    capture_mode: postnorm
    anchor_num: 64
    separate_last_hidden: true
    shift_input_embeds: false
    ce_loss_alpha: 0.1
    l1_loss_alpha: 0.9
    confidence_loss_alpha: 1.0
  teacher:
    model_name: /dev/shm/Kimi-K3
    inference_backend: vllm
    tensor_parallel_size: 8
    gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    quantization: ""
    generate_mode: prefill
    transport: mooncake
  draft:
    from_scratch: true
    num_layers: 5
    num_heads: 64
    num_kv_heads: 64
    head_dim: 128
    ffn_dim: 14336
    rms_norm_eps: 1.0e-5
    rope_theta: 50000.0
    rope_scaling_type: yarn
    rope_scaling_factor: 32.0
    rope_original_max_pos: 32768
    rope_beta_fast: 32.0
    rope_beta_slow: 1.0
    rope_mscale: 1.0
    rope_mscale_all_dim: 1.0
    use_aux_hidden_state: true
    use_input_layernorm_in_first_layer: true
    use_last_layernorm: true
    use_mtp_layernorm: false
    attention_bias: false
    mlp_bias: false
    dtype: bfloat16
    q_lora_rank: 1536
    kv_lora_rank: 512
    qk_nope_head_dim: 128
    qk_rope_head_dim: 64
    v_head_dim: 128
    markov_rank: 256
    markov_head_type: vanilla
    enable_confidence_head: true
    confidence_head_with_markov: true
    mask_token_id: 163837
    block_size: 7

mooncake:
  protocol: tcp
  device_name: ""
  global_segment_size: 16GB
  local_buffer_size: 4GB

quantization:
  training:
    fp8: null
    lumen_norm: true
    lumen_linear: true
    hf_attn_patch: true
  rollout_correction:
    enabled: false

dataset:
  chat_template: kimi-k3
  last_turn_loss_only: false
  num_preprocess_workers: 4
  cache_dir: /dev/shm/lumenrl_cache

eval:
  enabled: true
  interval: 1
  num_samples: 8
  micro_batch_size: 2

reward:
  type: function
  function: math_reward
  dataset: /dev/shm/kimi-mtp-dataset-phase1/train.jsonl

checkpointing:
  checkpoint_dir: /dev/shm/checkpoints/kimi_k3_dspark_smoke_test
  save_steps: 9999
  save_total_limit: 1
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 5
seed: 42

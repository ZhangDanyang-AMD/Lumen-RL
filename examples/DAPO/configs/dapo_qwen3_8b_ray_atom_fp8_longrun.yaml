# Ray colocated ATOM online rollout — FP8 FORMAL LONG RUN (Qwen3-8B-Base, DAPO math).
#
# ATOM counterpart of dapo_qwen3_8b_ray_vllm_fp8_longrun.yaml:
#   - rollout: ATOM AsyncLLMEngine with online_quant_config=per_block_fp8
#   - training: Lumen FP8 blockwise2d via run_dapo.sh TRAIN_FP8=1
#   - token-level TIS rollout correction
# Scale/hyperparams match the native vLLM formal long run:
# 1000 steps, batch 32x16=512, gen_batch 96, response 20480.

cluster:
  num_nodes: 1
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 8
      dispatch_mode: dp_compute_proto

policy:
  model_name: "${oc.env:DATA_ROOT}/models/Qwen3-8B-Base"
  training_backend: fsdp2
  generation_backend: atom
  max_total_sequence_length: 21504
  max_response_length: 20480
  train_global_batch_size: 512
  gen_batch_size: 96
  train_micro_batch_size: 1
  max_token_len_per_gpu: 21504
  learning_rate: 1.0e-6
  lr_warmup_steps: 10
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16
    fsdp_cfg:
      param_offload: false
      optimizer_offload: false
      reshard_after_forward: true
  generation:
    atom_cfg:
      transport: ray_http
      tensor_parallel_size: 1
      kv_cache_dtype: bf16
      gpu_memory_utilization: 0.30
      enable_prefix_caching: false
      online_quant_config:
        global_quant_config: per_block_fp8
    vllm_cfg:
      # Common rollout knobs consumed by the Ray ATOM adapter.
      transport: ray_http
      ray_http_start_server: false
      gpu_memory_utilization: 0.30
      max_model_len: 21504
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 32768
      max_num_seqs: 64
      quantization: fp8_per_block
      calculate_log_probs: true
      enable_sleep_mode: false
      sleep_level: 2
      update_weights_bucket_megabytes: 2048
      temperature: 1.0
      top_p: 1.0
      top_k: -1

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 16
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 20480
    filter_groups:
      enable: true
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 512
      penalty_factor: 1.0
      log: false

quantization:
  rollout:
    precision: fp8
  training:
    fp8: null
    lumen_norm: false
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet"
  shuffle: true
  shuffle_seed: 10086

val_dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/aime-2024.filtered.parquet"
val_steps: 10
val_batch_size: 0
eval:
  enabled: false
  num_samples: 0

checkpointing:
  checkpoint_dir: "${oc.env:DATA_ROOT}/ckpts/lumenrl-dapo/longrun-ray-atom-fp8-8b"
  save_steps: 50
  save_total_limit: 5
  resume: true

logger:
  wandb_enabled: true
  log_interval: 1
  wandb:
    project: LUMEN-RL
    name: longrun-ray-atom-fp8-8b-perblock

num_training_steps: 1000
seed: 10086

# verl-aligned Ray online rollout — FORMAL LONG RUN (Qwen3-30B-A3B-Base, DAPO math).
#
# MoE counterpart of dapo_qwen3_8b_ray_vllm_longrun.yaml: same Ray controller
# path (8 FSDP2 actors + 8 colocated vLLM AsyncLLM replicas at TP=1 + ZMQ
# CUDA-IPC weight sync) and the same 1:1 verl-aligned scale/hyperparameters
# (steps=1000, train_batch=32 x n=16, gen_batch=96, max_response=20480,
# overlong_buffer.len=512, rollout_is=token/2.0, lr=1e-6/warmup10/wd0.1,
# clip 0.2/0.28/10, token-mean, grpo). Only the policy differs: a routed-expert
# Qwen3-MoE (30.5B total / 3.3B active, 128 experts, top-8).
#
# Model and checkpoints live on the node-local /mnt/m2m_nobackup scratch disk
# ($SCRATCH_ROOT), not on the shared /home NFS volume. Datasets stay under
# $DATA_ROOT because they are small and shared across nodes.
#
# The Base checkpoint is required: the instruct/thinking Qwen3-30B-A3B never
# closes </think> inside the response budget, so every sample truncates with
# reward -1 and filter_groups collects no groups.

cluster:
  num_nodes: 1
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 8
      dispatch_mode: dp_compute_proto

policy:
  model_name: "${oc.env:SCRATCH_ROOT}/models/Qwen3-30B-A3B-Base"
  training_backend: fsdp2
  generation_backend: vllm
  max_total_sequence_length: 21504      # 1024 prompt + 20480 response
  max_response_length: 20480
  train_global_batch_size: 512          # 32 train prompts x 16 generations
  gen_batch_size: 96                    # over-sample 96 prompts/round
  train_micro_batch_size: 1
  max_token_len_per_gpu: 21504          # verl ppo_max_token_len_per_gpu
  learning_rate: 1.0e-6
  lr_warmup_steps: 10
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16               # COMPUTE dtype (master weights stay fp32)
    fsdp_cfg:
      # FSDP2 CPU offload is broken in the Ray worker path ("parameters should
      # be materialized on CPU"). micro_batch=1 bounds peak activation to ONE
      # 21504-token sequence, which fits on a 288GB MI355X alongside vLLM.
      param_offload: false
      optimizer_offload: false
      reshard_after_forward: true
  generation:
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      # Same 0.30 as the dense 8B long run. Note a TP=1 replica holds the full
      # 61GB BF16 MoE weight set, so of the ~86GB budget only ~25GB is left for
      # KV cache; expect vLLM to cap rollout concurrency well below max_num_seqs
      # at 21504-token sequences.
      gpu_memory_utilization: 0.30
      max_model_len: 21504
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 32768
      max_num_seqs: 64
      quantization: ""
      calculate_log_probs: true
      enable_sleep_mode: false
      update_weights_bucket_megabytes: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 16                 # verl rollout.n
    kl_coeff: 0.0                       # verl formal: use_kl_loss=False
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 20480
    filter_groups:
      enable: true
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 512
      penalty_factor: 1.0
      log: false

quantization:
  rollout:
    precision: bf16
  training:
    fp8: null
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet"
  shuffle: true
  shuffle_seed: 10086

# periodic validation on AIME (verl test_freq=10). NOTE: LumenRL val is greedy;
# verl uses val_kwargs.temperature=0.6 — diagnostic only, does not affect training.
val_dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/aime-2024.filtered.parquet"
val_steps: 10
val_batch_size: 0
eval:
  enabled: false
  num_samples: 0

checkpointing:
  checkpoint_dir: "${oc.env:SCRATCH_ROOT}/ckpts/lumenrl-dapo/longrun-ray-vllm-moe-a3b"
  save_steps: 50
  save_total_limit: 5
  resume: true

logger:
  wandb_enabled: true
  log_interval: 1
  wandb:
    project: LUMEN_RL
    name: longrun-ray-vllm-moe-a3b-verl-aligned

num_training_steps: 1000
seed: 10086

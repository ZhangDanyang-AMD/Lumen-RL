# Agentic RL long run on MoE: Qwen3-30B-A3B solves DAPO-Math with a code interpreter.
#
# dapo_qwen3_8b_ray_vllm_retool_longrun.yaml with the post-trained Qwen3-30B-A3B
# and the FSDP2/vLLM MoE settings of dapo_qwen3moe_a3b_ray_vllm_verlref_longrun.yaml
# (reshard after forward, 32k batched tokens, no routing replay), so the two
# agentic runs differ only in the model. Run it with LUMENRL_FP32_MOE_ROUTER=0
# like the other MoE runs, and add controller.ray.fully_async.* to run it fully
# async. Needs a SandboxFusion service at
# policy.generation.multi_turn.code_interpreter.url; on one node the RCCL
# weight sync also needs weight_sync.backend=rdma with
# weight_sync.rdma.{require_rdma=false,interface,hca} for the node.

cluster:
  num_nodes: 1
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 4
      dispatch_mode: dp_compute_proto
    rollout:
      num_workers: 4

policy:
  model_name: "${oc.env:DATA_ROOT}/models/Qwen3-30B-A3B"
  training_backend: fsdp2
  generation_backend: vllm
  max_total_sequence_length: 9216      # prompt with the tool schema + response
  max_response_length: 8192            # model turns and tool output together
  train_global_batch_size: 512         # 32 prompts x 16 rollouts
  gen_batch_size: 64
  train_micro_batch_size: 1
  max_token_len_per_gpu: 18432
  learning_rate: 1.0e-6
  lr_warmup_steps: 10
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16
    fsdp_cfg:
      param_offload: false
      optimizer_offload: false
      reshard_after_forward: true
  generation:
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      gpu_memory_utilization: 0.85
      max_model_len: 9216
      dtype: bfloat16
      # run_dapo.sh sets TORCHDYNAMO_DISABLE=1, and vLLM's CUDA graphs need
      # torch.compile ("aot_compile is not supported" at engine start).
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 32768
      max_num_seqs: 256
      quantization: ""
      calculate_log_probs: true
      enable_sleep_mode: false
      sleep_level: 2
      update_weights_bucket_megabytes: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1
    multi_turn:
      enabled: true
      format: hermes
      max_assistant_turns: 8
      max_parallel_calls: 1
      max_tool_response_length: 256
      tool_response_truncate_side: middle
      system_prompt: >-
        You can call the code_interpreter tool to run Python code. Use it to
        calculate and to check your reasoning before you give the final answer.
      chat_template_kwargs:
        enable_thinking: false
      code_interpreter:
        url: http://localhost:8080/run_code
        run_timeout_s: 30
        memory_limit_mb: 1024
        max_concurrency: 128

moe:
  r3:
    rollout_replay: false

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 16
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: false
    max_resp_len: 8192
    filter_groups:
      enable: true
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet"
  shuffle: true
  shuffle_seed: 10086

quantization:
  rollout:
    precision: bf16
  training:
    fp8: null
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

val_dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/aime-2024.filtered.parquet"
val_steps: 10
val_batch_size: 0
eval:
  enabled: false
  num_samples: 0                       # the whole file: 30 problems x 32 copies
  num_generations: 1
  temperature: 1.0
  top_p: 0.6

checkpointing:
  checkpoint_dir: "${oc.env:DATA_ROOT}/ckpts/lumenrl-dapo/retool-longrun-30b-a3b"
  save_steps: 20
  save_total_limit: 1
  resume: true

logger:
  wandb_enabled: false
  log_interval: 1
  wandb:
    project: LUMEN-RL-AGENTIC
    name: retool-longrun-30b-a3b

num_training_steps: 100
seed: 10086

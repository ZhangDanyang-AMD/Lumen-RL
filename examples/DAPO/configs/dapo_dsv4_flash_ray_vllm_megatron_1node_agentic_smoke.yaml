# DeepSeek-V4-Flash agentic smoke: the 1-node DAPO smoke with tool-calling rollouts.
#
# dapo_dsv4_flash_ray_vllm_megatron_1node_smoke.yaml unchanged (4-layer slice,
# Megatron-Native EP=8 and a TP=8 vLLM replica on the same 8 GPUs, synchronous)
# plus policy.generation.multi_turn: DeepSeek-V4's own encoding with DSML tool
# calls in chat mode, a SandboxFusion code interpreter, up to 8 assistant turns.
# Every prompt carries the tool schema and each turn goes through the agent
# loop. A 4-layer slice emits gibberish and never writes a DSML call, so the
# first assistant turn is scripted (multi_turn.scripted_first_turn): a
# code_interpreter call whose sandbox output enters the response as environment
# tokens before the slice generates. This checks the plumbing and the
# train-rollout agreement on the model's own tokens (rollout_corr/kl as the
# single-turn smoke's), not tool use. No routing replay: the slice's runs never
# had it, and multi-turn replay would need the prefix cache.
#
# Measured on one MI355X node, 6 steps each, judged by examples/DSv4_DAPO's
# status.sh (all PASS): with the scripted turn, 1 tool call per rollout, no
# tool errors, 63 environment tokens, rollout_corr/kl 3.02-3.99e-3, a training
# signal on 4 of 6 steps; unscripted, 0 calls, kl 2.87-3.90e-3. Both sit above
# the single-turn smoke's 2.45-3.30e-3 because their prompts carry the tool
# section (~445-508 tokens against ~138), and the slice's train-rollout gap grows
# with position (2048-4095: 4.6e-3 against 3.8e-3); the agent path with the tool
# and system prompt off, on the single-turn prompt length, gives 2.31-3.29e-3.

cluster:
  num_nodes: 1
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 8
      dispatch_mode: dp_compute_proto

policy:
  # BF16 weights under the CHECKPOINT's own tensor names, built by
  # ~/dsv4/mhc_probe/make_native_bf16.py. Neither of the obvious candidates
  # works: the released FP8 dir leaves vLLM holding FP8 parameters that the
  # trainer's BF16 weight sync cannot write ("'Parameter' object has no
  # attribute 'load_merged_column_weight'"), and the `fp8_cast_bf16` output is
  # BF16 but renamed into DeepSeek-HF form, which vLLM's DSv4 loader rejects
  # ("KeyError: 'layers.0.input_layernorm.weight'"). The trainer reads only
  # config.json from here and takes its weights from dist_checkpoint_path.
  model_name: "${oc.env:DATA_ROOT}/models/dsv4-L4-bf16-native"
  training_backend: megatron_native
  generation_backend: vllm
  max_total_sequence_length: 6144       # 2048 prompt budget + 4096 response
  max_response_length: 4096
  train_global_batch_size: 128          # 8 prompts x 16 generations
  gen_batch_size: 24                    # 8 * 3, verl's train:gen ratio
  train_micro_batch_size: 1
  max_token_len_per_gpu: 6144
  learning_rate: 1.0e-6
  lr_warmup_steps: 0
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16
    megatron_cfg:
      use_distributed_optimizer: true
      # ---- Expert Parallel: 256 experts across all 8 GPUs ----
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 8
      # Offline-converted weights; dist_checkpointing.load reshards them to this
      # topology on the way in.
      dist_checkpoint_path: "${oc.env:DATA_ROOT}/models/dsv4-L4_torch_dist"
      # Bitwise reproducibility. Without it ~1.6% of argmaxes flip run to run,
      # which is larger than the train/rollout gap DAPO is trying to measure.
      # Needs NCCL_ALGO=Ring in the environment, which ray_env_dsv4.sh sets.
      deterministic_mode: true
      # DSv4 has its own routing (sqrtsoftplus + expert bias + hash layers); the
      # rest of the MoE shape comes from the HF config.
      moe_grouped_gemm: true
      moe_token_dispatcher_type: alltoall
      moe_flex_dispatcher_backend: mori
      moe_mori_max_tokens_per_rank: null
      moe_mori_kernel_type: null
      moe_aux_loss_coeff: 0.0
      log_probs_chunk_size: 1024
      # See the header. Not a tuning choice.
      enable_dynamic_batch: false
    fsdp_cfg:
      param_offload: false
      optimizer_offload: false
  generation:
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      # TP=1 is not optional: it faults with `Memory access fault` on gfx950 for
      # every MoE backend / AITER combination tried.
      tensor_parallel_size: 8
      # Colocated, so NCCL_CUMEM_ENABLE=0 for the CUDA-IPC weight sync; vLLM's
      # custom all-reduce allocates its shared buffers through cuMem, and with
      # both every TP worker dies in create_shared_buffer ("HIP error: invalid
      # argument"). pynccl does the intra-node all-reduce instead.
      disable_custom_all_reduce: true
      kv_cache_dtype: fp8_e4m3
      # The default auto-selects AITER and dies in the first forward at
      # `moe_sorting_opus_fwd`; `triton_unfused` is FP4-only.
      moe_backend: triton
      # Training holds ~60 GB/rank of weights, grads and optimizer state.
      gpu_memory_utilization: 0.25
      max_model_len: 6144
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      # The profiling batch the validated rollout probe used; larger shrinks
      # nothing and the block-FP8 GEMM faults.
      max_num_batched_tokens: 2048
      max_num_seqs: 64
      quantization: ""
      calculate_log_probs: true
      enable_sleep_mode: false
      update_weights_bucket_megabytes: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1
    multi_turn:
      enabled: true
      format: dsml
      max_assistant_turns: 8
      max_parallel_calls: 1
      max_tool_response_length: 256
      tool_response_truncate_side: middle
      system_prompt: >-
        You can call the code_interpreter tool to run Python code. Use it to
        calculate and to check your reasoning before you give the final answer.
      chat_template_kwargs:
        thinking_mode: chat
      # The slice never writes a DSML call, so the first assistant turn is
      # scripted: one code_interpreter call, as environment tokens. Its output
      # comes back from the sandbox and the slice generates from there, so the
      # parse -> tool -> environment-token path runs on every rollout. Set it to
      # "" to see what the slice does unprompted.
      scripted_first_turn: "\n\n<｜DSML｜tool_calls>\n<｜DSML｜invoke name=\"code_interpreter\">\n<｜DSML｜parameter name=\"code\" string=\"true\">print(6 * 7)</｜DSML｜parameter>\n</｜DSML｜invoke>\n</｜DSML｜tool_calls>"
      code_interpreter:
        url: http://localhost:8080/run_code
        run_timeout_s: 30
        memory_limit_mb: 1024
        max_concurrency: 64

moe:
  r3:
    rollout_replay: false

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 16
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 4096
    # OFF for the sliced model, and only for it. A 4-layer slice feeds
    # `model.norm` and `lm_head` the layer-3 residual instead of the layer-42
    # one, so it emits gibberish and never solves a math problem. With filtering
    # on, every group is dropped for acc=0 and the run dies at `filter_groups
    # collected no valid groups`. Turn it back on for the full model.
    filter_groups:
      enable: false
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 512
      penalty_factor: 1.0
      log: false

quantization:
  rollout:
    precision: bf16
  training:
    fp8: null
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  # Reused as-is. The parquet was filtered with Qwen3-8B-Base's tokenizer, so its
  # 1024-token cutoff does not transfer to V4's 129280-token vocab; the raw text
  # is what matters, and `_tokenize_prompts` truncates at 1024 anyway.
  dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet"
  shuffle: true
  shuffle_seed: 10086

val_dataset: ""
val_steps: 0
val_batch_size: 0
eval:
  enabled: false
  num_samples: 0

checkpointing:
  checkpoint_dir: ""
  save_steps: 1000
  save_total_limit: 0
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 3
seed: 10086

# Agentic RL on MoE with Megatron-Native training and rollout routing replay (R3).
#
# The multi-turn setup of dapo_qwen3moe_a3b_ray_vllm_retool_longrun.yaml
# (Qwen3-30B-A3B, code interpreter, 8 turns, non-thinking) on the training and
# rollout layout of dapo_qwen3moe_a3b_ray_megatron_verlref_4k_smoke.yaml: 8 GPUs
# shared by Megatron (EP=8, DP=8) and vLLM, so it runs synchronously. With
# moe.r3.enabled the vLLM rollout returns, turn by turn, the experts it routed
# every token of a trajectory to, and Megatron replays them; set it to false
# for the same run without replay. 16 prompts x 16 rollouts per step,
# 4k responses: with 8k, Megatron's backward ran out of memory beside vLLM's
# 0.35 of the GPU (step 2, 141.7 GiB allocated by Megatron). Weight sync is the
# colocated default (weight_sync.backend=auto); an RCCL backend between the
# actors and the replicas on the same GPUs fails with "Duplicate GPU detected".
#
# Prefix caching is on. Replay does not need it -- each turn keeps the routing
# of the forwards that sampled it -- but with it a later turn attends to the KV
# the earlier turns were sampled with, as the trainer's forward does; without
# it, to a re-prefill's.
#
# Measured (MI355X, 5 steps each, same seed), rollout_corr/k3_kl: 3.6e-4 with
# replay and the prefix cache, 4.2e-4 with replay and no cache, 1.18e-3
# without replay. Before each turn kept its own routing, replay without the
# cache reached only 9.7e-4. Single-turn (tool off): 3.8e-4 with replay and
# 7.95e-4 without.
#
# Run it with LUMENRL_FP32_MOE_ROUTER=0 like the other MoE runs, against a
# SandboxFusion service at policy.generation.multi_turn.code_interpreter.url.

cluster:
  num_nodes: 1
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 8
      dispatch_mode: dp_compute_proto

policy:
  model_name: "${oc.env:DATA_ROOT}/models/Qwen3-30B-A3B"
  training_backend: megatron_native
  generation_backend: vllm
  max_total_sequence_length: 6144      # prompt with the tool schema + response
  max_response_length: 4096            # model turns and tool output together
  train_global_batch_size: 256         # 16 prompts x 16 rollouts
  gen_batch_size: 32
  train_micro_batch_size: 1
  max_token_len_per_gpu: 6144
  learning_rate: 1.0e-6
  lr_warmup_steps: 0
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16
    megatron_cfg:
      use_distributed_optimizer: true
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 8
      sequence_parallel: false
      moe_grouped_gemm: true
      moe_token_dispatcher_type: alltoall
      moe_flex_dispatcher_backend: mori
      moe_mori_max_tokens_per_rank: null
      moe_mori_kernel_type: null
      moe_aux_loss_coeff: 0.0
      moe_router_dtype: null
      log_probs_chunk_size: 1024
      enable_dynamic_batch: true
      max_tokens_per_gpu: 6144
  generation:
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      gpu_memory_utilization: 0.30
      max_model_len: 6144
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      enable_prefix_caching: true
      max_num_batched_tokens: 16384
      max_num_seqs: 256
      quantization: ""
      calculate_log_probs: true
      enable_sleep_mode: false
      update_weights_bucket_megabytes: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1
    multi_turn:
      enabled: true
      format: hermes
      max_assistant_turns: 8
      max_parallel_calls: 1
      max_tool_response_length: 256
      tool_response_truncate_side: middle
      system_prompt: >-
        You can call the code_interpreter tool to run Python code. Use it to
        calculate and to check your reasoning before you give the final answer.
      chat_template_kwargs:
        enable_thinking: false
      code_interpreter:
        url: http://localhost:8080/run_code
        run_timeout_s: 30
        memory_limit_mb: 1024
        max_concurrency: 128

moe:
  r3:
    enabled: true
    rollout_replay: false
    print_train_rollout_mismatch: true

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 16
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: false
    max_resp_len: 4096
    filter_groups:
      enable: true
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet"
  shuffle: true
  shuffle_seed: 10086

quantization:
  rollout:
    precision: bf16
  training:
    fp8: null
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

val_dataset: ""
val_steps: 0
val_batch_size: 0
eval:
  enabled: false
  num_samples: 0

checkpointing:
  checkpoint_dir: ""
  save_steps: 1000
  save_total_limit: 0
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 5
seed: 10086

# verl-aligned Ray online rollout — FORMAL LONG RUN (Qwen3-30B-A3B-Base MoE, DAPO math).
# MoE + Expert-Parallel variant of dapo_qwen3_8b_ray_megatron_longrun.yaml.
#
# Same DAPO hyperparams / scale as the 8B dense megatron long run
#   (steps=1000, train_batch=32 x n=16 =512, gen_batch=96, max_prompt=1024,
#    max_response=20480, ppo_max_token/gpu=21504, overlong_buffer.len=512,
#    rollout_is=token/2.0, lr=1e-6/warmup10/wd0.1, clip 0.2/0.28/10, token-mean,
#    grpo, max_num_seqs=64, max_num_batched_tokens=32768),
# but the policy is Qwen3-30B-A3B-Base (128 experts, top-8) trained with Expert
# Parallel: EP=8, TP=1, PP=1, CP=1 -> attention DP=8, experts sharded across all
# 8 GPUs. grouped-GEMM experts, fp32 router, MoE aux-loss OFF (RL loss unchanged).

cluster:
  num_nodes: 1
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 8
      dispatch_mode: dp_compute_proto

policy:
  model_name: "${oc.env:DATA_ROOT}/models/Qwen3-30B-A3B-Base"
  training_backend: megatron_native
  generation_backend: vllm
  max_total_sequence_length: 21504
  max_response_length: 20480
  train_global_batch_size: 512
  gen_batch_size: 96
  train_micro_batch_size: 1
  max_token_len_per_gpu: 21504
  learning_rate: 1.0e-6
  lr_warmup_steps: 10
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16
    megatron_cfg:
      use_distributed_optimizer: true
      # ---- Expert Parallel: 128 experts sharded across all 8 GPUs ----
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 1
      context_parallel_size: 1
      expert_model_parallel_size: 8
      moe_grouped_gemm: true
      moe_aux_loss_coeff: 0.0
      moe_router_dtype: fp32
      # Full activation recomputation: bounds activation peak for resp=20480 on 30B.
      recompute_granularity: full
      recompute_method: uniform
      recompute_num_layers: 1
      log_probs_chunk_size: 1024
      enable_dynamic_batch: true
      max_tokens_per_gpu: 21504
    fsdp_cfg:
      param_offload: false
      optimizer_offload: false
      reshard_after_forward: true
  generation:
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      gpu_memory_utilization: 0.30
      max_model_len: 21504
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 32768
      max_num_seqs: 64
      quantization: ""
      calculate_log_probs: true
      enable_sleep_mode: false
      sleep_level: 2
      update_weights_bucket_megabytes: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 16
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 20480
    filter_groups:
      enable: true
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 512
      penalty_factor: 1.0
      log: false

quantization:
  rollout:
    precision: bf16
  training:
    fp8: null
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet"
  shuffle: true
  shuffle_seed: 10086

val_dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/aime-2024.filtered.parquet"
val_steps: 10
val_batch_size: 0
eval:
  enabled: false
  num_samples: 0

checkpointing:
  checkpoint_dir: "${oc.env:DATA_ROOT}/ckpts/lumenrl-dapo/longrun-ray-megatron-moe-a3b-ep8"
  save_steps: 50
  save_total_limit: 5
  resume: true

logger:
  wandb_enabled: true
  log_interval: 1
  wandb:
    project: LumenRL
    name: longrun-ray-megatron-moe-a3b-ep8

num_training_steps: 1000
seed: 10086

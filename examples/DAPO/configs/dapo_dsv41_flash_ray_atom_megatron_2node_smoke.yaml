# DeepSeek-V4.1-Flash DAPO smoke on two nodes: all 40 layers, Megatron-Native
# PP2 x EP8 (the release's stage split at layer 20, which keeps every shared KV /
# index / candidate source inside its stage) + four TP4 ATOM replicas, colocated.
#
# The one-node slice-B smoke (dapo_dsv41_sliceB_ray_atom_megatron_1node_smoke.yaml)
# with the full model; everything it says about the environment holds here, plus
# RDMA between the nodes. Per card: routed experts 68 GB (frozen BF16, 1/16 of
# them), non-expert weights 8 GB, optimizer state and gradients ~22 GB, ATOM's
# FP8 / FP4 weights ~70 GB and its KV cache.
#
# Launch: one container per node with a Ray head and a worker, the trainer on
# the head with cluster.ray_address set.
#
# Measured (043 + 087, 16 MI355X, ionic RDMA): 3 steps, exit 0. A step 228-313 s
# (generation 169-223 s, training 30-43 s, weight sync 18-19 s for 820 tensors /
# 18 GB, every one applied on all four replicas); training peaks at 137-150 GiB a
# card; DAPO-Math accuracy 0.44 / 0.61 / 0.33; rollout_corr/k3_kl 1.05e-2 /
# 8.1e-3 / 8.1e-3 -- the 1.06e-2 the engine measured against ATOM offline.

cluster:
  num_nodes: 2
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 16
      dispatch_mode: dp_compute_proto
      process_on_nodes: [8, 8]

policy:
  model_name: "/mnt/m2m_nobackup/xysheng/models/DeepSeek-V4.1-Flash"
  training_backend: megatron_native
  generation_backend: atom
  max_total_sequence_length: 3072
  max_response_length: 2048
  train_global_batch_size: 64           # 8 prompts x 8 generations
  gen_batch_size: 8
  train_micro_batch_size: 1
  max_token_len_per_gpu: 3072
  learning_rate: 1.0e-6
  lr_warmup_steps: 0
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16
    megatron_cfg:
      use_distributed_optimizer: true
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 8
      # Without it two forwards of one batch differ by 0.28 in mean token
      # log-prob on this slice; with it, exactly 0.
      deterministic_mode: true
      recompute_granularity: full
      moe_grouped_gemm: true
      moe_token_dispatcher_type: alltoall
      moe_aux_loss_coeff: 0.0
      log_probs_chunk_size: 1024
      enable_dynamic_batch: false
      dsv41_quant_points:
        window_kv_fp8: false
        compressed_kv_fp4: false
        indexer_fp4: false
        attn_out_fp8: true
        linear_act_fp8: false
    fsdp_cfg:
      param_offload: false
      optimizer_offload: false
  generation:
    atom_cfg:
      transport: ray_http
      tensor_parallel_size: 4
      kv_cache_dtype: bf16
      # ATOM's fraction is of the whole card and counts what training already
      # holds there: 0.38 left its KV budget at -79 GB (ATOM asked for >= 0.66);
      # 0.80 left training too little for its update (OUT_OF_RESOURCES in the
      # expert alltoall). ATOM's sleep frees nothing for V4.1, so it is set once.
      gpu_memory_utilization: 0.70
      enable_prefix_caching: false
      online_quant_config: {}
      engine_kwargs:
        index_cache_dtype: fp8
        kv_cache_block_size: 16
        compilation_config:
          level: 0
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      gpu_memory_utilization: 0.70
      max_model_len: 3072
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 8192
      max_num_seqs: 32                  # 16 requests a replica; a smaller state pool
      quantization: ""
      calculate_log_probs: true
      enable_sleep_mode: false
      update_weights_bucket_megabytes: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1

moe:
  r3:
    rollout_replay: false

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 8
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 2048
    filter_groups:
      enable: false
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 512
      penalty_factor: 1.0
      log: false

quantization:
  rollout:
    precision: bf16
  training:
    fp8: null
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  dataset: "/mnt/m2m_nobackup/xysheng/dsv4rel/work/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet"
  shuffle: true
  shuffle_seed: 10086

val_dataset: ""
val_steps: 0
val_batch_size: 0
eval:
  enabled: false
  num_samples: 0

checkpointing:
  checkpoint_dir: ""
  save_steps: 1000
  save_total_limit: 0
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 3
seed: 10086

# DeepSeek-V4.1-Flash DAPO-Math long run on two nodes: the two-node smoke
# (dapo_dsv41_flash_ray_atom_megatron_2node_smoke.yaml: all 40 layers, PP2 x EP8 +
# four TP4 ATOM replicas, colocated) with the recipe of the earlier long runs
# (dapo_qwen3_8b_ray_atom_bf16_longrun.yaml): DAPO-Math-17k, AIME 2024 every 10
# steps and once before the first (mean@8).
#
#   * Chat mode (no thinking), 10K context. Thinking, even at reasoning effort low,
#     V4.1 is at the ceiling of this recipe: step-0 accuracy 0.948 on DAPO-Math,
#     0.955 on AIME 1983-2023, AIME 2024 mean@8 0.917 -- little a run could show.
#     In chat mode 0.827 on DAPO-Math (29% of prompts solved 1-3 times of 4) and
#     AIME 2024 mean@8 0.750 (Inferact measured 0.737); responses p99 5.5K tokens.
#   * ATOM asleep through training, its weights on the host (V4.1's frozen
#     routed experts are never synced, so ATOM's own sleep would lose them).
#   * No checkpoints: with the frozen experts a checkpoint of this model is ~1 TB.

cluster:
  num_nodes: 2
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 16
      dispatch_mode: dp_compute_proto
      process_on_nodes: [8, 8]

policy:
  model_name: "/mnt/m2m_nobackup/xysheng/models/DeepSeek-V4.1-Flash"
  training_backend: megatron_native
  generation_backend: atom
  max_total_sequence_length: 10240
  max_response_length: 8192
  train_global_batch_size: 128          # 16 prompts x 8 generations
  gen_batch_size: 16
  train_micro_batch_size: 1
  max_token_len_per_gpu: 10240
  learning_rate: 1.0e-6
  lr_warmup_steps: 0
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16
    megatron_cfg:
      use_distributed_optimizer: true
      tensor_model_parallel_size: 1
      pipeline_model_parallel_size: 2
      context_parallel_size: 1
      expert_model_parallel_size: 8
      deterministic_mode: true
      recompute_granularity: full
      moe_grouped_gemm: true
      moe_token_dispatcher_type: alltoall
      moe_aux_loss_coeff: 0.0
      log_probs_chunk_size: 1024
      enable_dynamic_batch: false
      dsv41_quant_points:
        window_kv_fp8: false
        compressed_kv_fp4: false
        indexer_fp4: false
        attn_out_fp8: true
        linear_act_fp8: false
    fsdp_cfg:
      param_offload: false
      optimizer_offload: false
  generation:
    chat_template_kwargs:
      thinking_mode: chat
    atom_cfg:
      transport: ray_http
      tensor_parallel_size: 4
      kv_cache_dtype: bf16
      gpu_memory_utilization: 0.70
      sleep_keeps_weights: true
      enable_prefix_caching: false
      online_quant_config: {}
      engine_kwargs:
        index_cache_dtype: fp8
        kv_cache_block_size: 16
        compilation_config:
          level: 0
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      gpu_memory_utilization: 0.70
      max_model_len: 10240
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 8192
      max_num_seqs: 32
      quantization: ""
      calculate_log_probs: true
      enable_sleep_mode: true
      update_weights_bucket_megabytes: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1

moe:
  r3:
    rollout_replay: false

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 8
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 8192
    filter_groups:
      enable: false
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 1024
      penalty_factor: 1.0
      log: false

quantization:
  rollout:
    precision: bf16
  training:
    fp8: null
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  dataset: "/mnt/m2m_nobackup/xysheng/dsv4rel/work/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet"
  shuffle: true
  shuffle_seed: 10086

# AIME 2024 with each problem once (the filtered parquet repeats each 32 times)
val_dataset: "/home/xysheng/rl_data/datasets/math/aime-2024.distinct.parquet"
val_steps: 10
val_before_train: true
val_batch_size: 0
eval:
  enabled: false
  num_samples: 0
  num_generations: 8
  temperature: 1.0
  top_p: 1.0

checkpointing:
  checkpoint_dir: ""
  save_steps: 1000
  save_total_limit: 0
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 50
seed: 10086

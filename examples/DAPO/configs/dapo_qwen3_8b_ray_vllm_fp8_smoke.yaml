# verl-aligned online rollout SMOKE — strict per_block_fp8 (Qwen3-8B-Base, DAPO).
#
# Reproduces verl `rollout.quantization=fp8_per_block` entirely inside LumenRL's
# native Ray controller path (NO verl dependency):
#   - rollout : vLLM AsyncLLM online `fp8_per_block` (per-128-block FP8). The
#     BF16 actor weights are re-quantized to per-block FP8 inside vLLM on every
#     IPC weight sync, via lumenrl.engine.inference.vllm_fp8_utils (ROCm-safe
#     weight processing + layerwise reload) — verl-free port.
#   - token-level TIS rollout correction (corrects the FP8 vs BF16 gap;
#     validated rollout_corr/kl ~= 4-5e-3, matching verl per_block_fp8).
#   - training: FP8 end-to-end (blockwise2d Lumen FP8 linear, fp32 master), opt-in
#     via run_dapo.sh TRAIN_FP8=1 (LUMEN_FP8=1 LUMEN_FP8_SCALING=blockwise2d). With
#     TRAIN_FP8=0 the training forward stays BF16 (fp32 master + bf16 compute).
#
# The `fp8: null` under quantization.training below is the config default (BF16
# forward); the FP8 E2E training axis is driven by the LUMEN_FP8 env in the run
# script, not by this file. `per_block_fp8` here = the online rollout quant.
#
# filter_groups disabled for the smoke: with max_response_length=512 a base model
# rarely finishes DAPO math, so dynamic sampling would filter out all groups. The
# real long run (resp 20480, gen_batch 96) keeps it on.
#
# Small batch / short horizon so it finishes fast on 8 GPUs. Launch via
# run_smoke_ray_vllm_fp8.sh (overrides model/data).

cluster:
  num_nodes: 1
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 8
      dispatch_mode: dp_compute_proto

policy:
  model_name: /home/shengnxu/xysheng/data/models/Qwen3-8B-Base
  training_backend: fsdp2
  generation_backend: vllm
  max_total_sequence_length: 2048
  max_response_length: 512
  train_global_batch_size: 128         # 8 prompts x 16 generations
  gen_batch_size: 24                   # over-sample prompts/round for filter_groups
  train_micro_batch_size: 1
  max_token_len_per_gpu: 2048
  learning_rate: 1.0e-6
  lr_warmup_steps: 10
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16
    fsdp_cfg:
      param_offload: false
      optimizer_offload: false
  generation:
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      gpu_memory_utilization: 0.30
      max_model_len: 2048
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 4096
      max_num_seqs: 64
      quantization: fp8_per_block      # verl-aligned online per-block FP8 rollout
      calculate_log_probs: true        # TIS rollout correction
      enable_sleep_mode: false
      sleep_level: 2
      update_weights_bucket_megabytes: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 16
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: false
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 512
    filter_groups:
      enable: false                    # smoke: resp=512 too short for DAPO math
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 256
      penalty_factor: 1.0
      log: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  dataset: /home/shengnxu/xysheng/data/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet

quantization:
  rollout:
    precision: fp8
  training:
    fp8: null                          # config default = BF16 forward; FP8 E2E training via run_dapo.sh TRAIN_FP8=1 (LUMEN_FP8 env)
    lumen_norm: false
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

checkpointing:
  checkpoint_dir: /home/shengnxu/xysheng/data/ckpts/lumenrl-dapo/ray-vllm-fp8-smoke
  save_steps: 1000
  save_total_limit: 1
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 3
seed: 10086

# vLLM fp8 end-to-end smoke: 4k response, 8 generations, reduced batch, no ckpt/eval.

cluster:
  num_nodes: 1
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 8
      dispatch_mode: dp_compute_proto

policy:
  model_name: /home/shengnxu/xysheng/data/models/Qwen3-8B-Base
  training_backend: fsdp2
  generation_backend: vllm
  max_total_sequence_length: 5120
  max_response_length: 4096
  train_global_batch_size: 64
  gen_batch_size: 24
  train_micro_batch_size: 1
  max_token_len_per_gpu: 5120
  learning_rate: 1.0e-6
  lr_warmup_steps: 10
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16
    fsdp_cfg:
      param_offload: false
      optimizer_offload: false
      reshard_after_forward: true
  generation:
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      gpu_memory_utilization: 0.30
      max_model_len: 5120
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 8192
      max_num_seqs: 64
      quantization: fp8_per_block
      calculate_log_probs: true
      enable_sleep_mode: false
      update_weights_bucket_megabytes: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 8
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 4096
    filter_groups:
      enable: true
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 1024
      penalty_factor: 1.0
      log: false

quantization:
  rollout:
    precision: fp8
  training:
    fp8: null
    lumen_norm: false
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  dataset: /home/shengnxu/xysheng/data/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet
  shuffle: true
  shuffle_seed: 10086

val_dataset: ""
val_steps: 0
val_batch_size: 0
eval:
  enabled: false
  num_samples: 0

checkpointing:
  checkpoint_dir: ""
  save_steps: 1000
  save_total_limit: 0
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 3
seed: 10086

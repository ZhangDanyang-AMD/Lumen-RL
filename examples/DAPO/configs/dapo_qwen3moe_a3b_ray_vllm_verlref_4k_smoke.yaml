# Chain smoke for dapo_qwen3moe_a3b_ray_vllm_verlref_longrun.yaml.
#
# Same recipe as the verl FP8-E2E BF16 reference port, shrunk on the two axes
# that only cost wall clock: response horizon 20480 -> 4096 and prompt batch
# 128 -> 8 (gen 384 -> 24, keeping verl's 1:3 train:gen ratio and n=16). The
# prompt budget stays at verl's 2048, so this exercises the same dataset and the
# same packing/varlen paths as the long run.
#
# Everything that defines the optimization problem is untouched: grpo,
# token-mean, clip 0.2/0.28/10, lr 1e-6 with NO warmup, wd 0.1, clip_grad 1.0,
# entropy_coeff 0, overlong_buffer 512/1.0, filter_groups acc/10, token-level
# TIS at C=2.0, temperature/top_p/top_k 1.0/1.0/-1, BF16 MoE router, R3 off.
#
# Run with LUMENRL_FP32_MOE_ROUTER=0 -- that env var, not this file, is what
# puts the router matmul in BF16 to match verl.
#
# Expect a HIGHER rollout_corr/kl than the R3+fp32-router MoE smoke: verl's own
# writeup says "rollout & training distribution mismatch is in general higher
# for MoE, rollout correction required even for BF16", and this config
# deliberately has neither of our two mismatch reducers.

cluster:
  num_nodes: 1
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 8
      dispatch_mode: dp_compute_proto

policy:
  model_name: "${oc.env:DATA_ROOT}/models/Qwen3-30B-A3B-Base"
  training_backend: fsdp2
  generation_backend: vllm
  max_total_sequence_length: 6144       # verl's 2048 prompt + 4096 response
  max_response_length: 4096
  train_global_batch_size: 128          # 8 prompts x 16 generations
  gen_batch_size: 24                    # 8 * 3, verl's train:gen ratio
  train_micro_batch_size: 1
  max_token_len_per_gpu: 6144
  learning_rate: 1.0e-6
  lr_warmup_steps: 0
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16
    fsdp_cfg:
      param_offload: false
      optimizer_offload: false
      reshard_after_forward: true
  generation:
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      gpu_memory_utilization: 0.30
      max_model_len: 6144
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 8192
      max_num_seqs: 256
      quantization: ""
      calculate_log_probs: true
      enable_sleep_mode: false
      update_weights_bucket_megabytes: 512
      temperature: 1.0
      top_p: 1.0
      top_k: -1

moe:
  r3:
    rollout_replay: false

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 16
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 4096
    filter_groups:
      enable: true
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 512
      penalty_factor: 1.0
      log: false

quantization:
  rollout:
    precision: bf16
  training:
    fp8: null
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  # Same file as the long run; verl's 2048 prompt budget filters nothing extra
  # out of DAPO-Math-17k, see the note there.
  dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet"
  shuffle: true
  shuffle_seed: 10086

val_dataset: ""
val_steps: 0
val_batch_size: 0
eval:
  enabled: false
  num_samples: 0

checkpointing:
  checkpoint_dir: ""
  save_steps: 1000
  save_total_limit: 0
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 3
seed: 10086

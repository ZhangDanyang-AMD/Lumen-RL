# verl-aligned Ray rollout — 50-step cmp (4k), config-matched to
# run_cmp50_lumen_4k.sh / run_compare_verl_bf16_4k.sh so metrics are directly
# comparable to cmp50-lumen-4k-*.log (LumenRL torchrun) and the verl 4k baseline.
#
# Same DAPO recipe (resp=4096, 16 prompts x n=8 = 128, gen=48, seed=10086, TIS,
# filter_groups, dual-clip token-mean) but routed through the Ray controller
# path: 8 training actors (FSDP2 sharded) + 8 colocated vLLM AsyncLLM replicas
# (TP=1) + ZMQ CUDA-IPC weight sync.
#
# Deltas vs the torchrun cmp50 (documented): training forward is pure torch SDPA
# (LUMEN_DISABLE_HF_ATTN_PATCH=1, matches verl native, not ATOM); FSDP offload
# off + rollout engines resident (256GB, no ROCm sleep).

cluster:
  num_nodes: 1
  gpus_per_node: 8

controller:
  ray:
    enabled: true
    fuse_actor_ref: false
    actor:
      num_workers: 8
      dispatch_mode: dp_compute_proto

policy:
  model_name: "${oc.env:DATA_ROOT}/models/Qwen3-8B-Base"
  training_backend: fsdp2
  generation_backend: vllm
  max_total_sequence_length: 5120       # 1024 prompt + 4096 response
  max_response_length: 4096
  train_global_batch_size: 128          # 16 train prompts x 8 generations
  gen_batch_size: 48                    # over-sample 48 prompts/round (verl 16x3)
  train_micro_batch_size: 1
  max_token_len_per_gpu: 5120
  learning_rate: 1.0e-6
  lr_warmup_steps: 10
  weight_decay: 0.1
  max_grad_norm: 1.0
  lr_decay_style: constant
  training:
    optimizer_dtype: bf16
    fsdp_cfg:
      param_offload: false
      optimizer_offload: false
  generation:
    vllm_cfg:
      transport: ray_http
      ray_http_start_server: false
      gpu_memory_utilization: 0.30
      max_model_len: 5120
      dtype: bfloat16
      enforce_eager: true
      enable_chunked_prefill: true
      max_num_batched_tokens: 8192
      max_num_seqs: 64
      quantization: ""
      calculate_log_probs: true
      enable_sleep_mode: false
      temperature: 1.0
      top_p: 1.0
      top_k: -1

algorithm:
  name: dapo
  adv_estimator: grpo
  use_kl_in_reward: false
  loss_agg_mode: token-mean
  dapo:
    num_generations: 8
    kl_coeff: 0.0
    clip_ratio_low: 0.2
    clip_ratio_high: 0.28
    clip_ratio_c: 10.0
    dynamic_sampling: true
    token_level_pg: true
    overlong_reward_shaping: true
    max_resp_len: 4096
    filter_groups:
      enable: true
      metric: acc
      max_num_gen_batches: 10
    overlong_buffer:
      enable: true
      len: 1024
      penalty_factor: 1.0
      log: false

reward:
  type: function
  function: lumenrl.rewards.math_reward.dapo_math_reward
  dataset: "${oc.env:DATA_ROOT}/data_cached/qwen3-8b-maxprompt1024/dapo-math-17k.filtered.parquet"

quantization:
  rollout:
    precision: bf16
  training:
    fp8: null
  rollout_correction:
    rollout_is: token
    rollout_is_threshold: 2.0
    rollout_is_batch_normalize: false

checkpointing:
  checkpoint_dir: "${oc.env:DATA_ROOT}/ckpts/lumenrl-dapo/cmp50-ray-vllm-4k"
  save_steps: 999
  save_total_limit: 1
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 50
seed: 10086

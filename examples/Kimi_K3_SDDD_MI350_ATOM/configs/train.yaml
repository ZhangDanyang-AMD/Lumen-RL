# Kimi K3 DSpark SDDD — MI350 (ATOM teacher, off-policy prefill, 8-GPU sequential)
#
# Second-generation recipe. The first run is documented in
# amd-rl-runbook/kimi-k3-dspark-sddd-lumenrl-atom-runbook.md; the analysis behind
# every change here is in
# amd-rl-runbook/kimi-k3-dspark-torchspec-alignment-log.md.
#
# -- Why this file was rewritten ---------------------------------------------
# The first run converged (eval AL 1.863 at step 5000 of 5413) and then served
# at 6.0% acceptance on ATOM against the official Kimi-K3 target, where
# Inferact's released DSpark draft measures 26.1% on the identical stack. The
# draft had been trained under an attention definition ATOM does not implement:
#
#   1. RoPE rotation. LumenRL rotated NeoX half-split; DeepSeek/Kimi MLA — and
#      therefore TorchSpec, and therefore ATOM under the published config —
#      rotates interleaved pairs. Note ATOM's config key for this is
#      `rope_interleave` wired to aiter's `is_neox_style`, so its meaning is the
#      inverse of its name.
#   2. Softmax scale. LumenRL used 1/sqrt(qk_head_dim); TorchSpec and ATOM both
#      widen it by yarn_get_mscale(factor, mscale_all_dim)^2 = 1.8133x.
#
# Both are fixed in lumenrl/models/dspark.py and asserted numerically by
# selfcheck/verify_rope_alignment.py, which rebuilds ATOM's own rotary embedding
# through the same get_rope call the server makes and compares. Serving knobs
# were used to paper over both during the benchmark (rope_interleave: true,
# mscale 0/0) and recovered 6.01% -> 14.82%; they are not used any more, because
# a checkpoint that needs them is not a K3DSparkModel checkpoint.
#
# Hyperparameters are now copied from TorchSpec's reference recipe,
# configs/vllm_kimi_k3_dspark_stage1.yaml, instead of being re-derived. See
# policy:.
#
# -- Data flow ----------------------------------------------------------------
#   1. Phase A: ATOM re-prefills each dataset row's full prompt+response and
#      captures layers [2,23,47,71,89], Mooncake -> /dev/shm. There is no decode
#      sweep; responses were pre-generated by K3 in a separate pass, which makes
#      this a cached on-policy distillation run through the off-policy path.
#   2. Once cache_batches batches are collected, the draft goes onto the GPUs and
#      trains on the cached hidden states.
#   3. The draft is offloaded back to CPU; return to step 1.
#
# Usage:
#   bash examples/Kimi_K3_SDDD_MI350_ATOM/run_kimi_k3.sh

cluster:
  gpus_per_node: 8
  num_nodes: 1

policy:
  model_name: /home/jimguo12/k3-target-official
  training_backend: fsdp2
  generation_backend: hf
  # 8192, up from the first run's 2048. TorchSpec stage1 trains at 32768, but that
  # is 8 dedicated training GPUs on 2 nodes with inference on another 4; here the
  # teacher time-shares the same 8 GPUs.
  #
  # Confirmed against the cached on-policy set rather than assumed: rows are
  # mean 1071, p50 568, p90 2441, p99 6399 tokens, so **8192 keeps 98.7%**
  # (106,366 of 107,760). 16384 would keep 100%, and costs more than it is worth —
  # the extra 1,394 rows nearly double the padded batch width (worst cached batch
  # 186 GiB against 98 GiB), which drops cache_batches from 10 to 6 and adds ~75
  # reloads across the run. 4096 would still keep 96.1% if the budget ever demands
  # it.
  #
  # /!\ Known gap, deliberately accepted: the target is served at
  # max_model_len 16384, so the draft will meet positions it never trained on and
  # is relying on YaRN extrapolation there. The 1.3% dropped are exactly the
  # longest-reasoning rows, and the dataset already biases against them (every row
  # that hit the 15328-token generation cap was dropped upstream for having no
  # closing think marker). Worth watching in eval before blaming anything else.
  #
  # /!\ Every hidden-state budget in this file scales linearly with it — see the
  # sizing table under mooncake:.
  max_total_sequence_length: 8192
  # ---- Optimizer block copied from TorchSpec vllm_kimi_k3_dspark_stage1.yaml.
  # /!\ These are a set; do not re-derive one from another. The first run scaled
  # lr linearly from a 6e-4 @ bs=512 recipe and got 7.5e-5 @ bs=64. TorchSpec's
  # reference is 5e-5 @ bs=128 — 2.7x below what that scaling law predicts — and
  # it is the recipe behind a draft that serves at 26%.
  #
  # TorchSpec expresses the batch as 8 ranks x micro_batch_size 1 x
  # draft_accumulation_steps 16 = 128. LumenRL derives the same: _plan_micro_batches
  # computes ceil((128 / 1) / 8) = 16 backward passes per rank, and the effective
  # batch stays 128. `_grad_accum_steps` is not a config field.
  train_global_batch_size: 128
  train_micro_batch_size: 1
  learning_rate: 5.0e-5
  min_lr: 0.0
  lr_decay_style: cosine
  weight_decay: 0.0
  # 1.0, from TorchSpec. The first run's 0.5 was chosen against a grad_norm
  # distribution (0.48-1.38) measured under the old lr and batch, so it does not
  # transfer.
  max_grad_norm: 1.0
  warmup_ratio: 0.04

algorithm:
  name: spec_distill
  spec_distill:
    draft_type: dspark
    loss_type: dspark
    sequential_mode: batch_alternating
    # /!\ Down from the first run's 50, because a cached batch grew ~8x with the
    # batch size and the window. Sized against tmpfs, which is the binding
    # constraint:
    #   (5 aux + 1 token_embeds + 1 last_hidden) x 7168 x 2 B = 98 KiB per token
    # /dev/shm is 1.5 TiB, less the 238 GiB mooncake segment and the dataset and
    # tokenizer caches, so ~1288 GiB is usable; taken at 85% that is 1095 GiB.
    #
    # Measured on the cached on-policy set at this window (preprocess_dataset.py):
    # a cached batch pads to its own longest row, and over the batches the sampler
    # actually builds that is **median 85.0 GiB, worst 98.0 GiB** — so the ceiling
    # is **11** and 10 sits at 980 GiB with real margin.
    #
    # /!\ Size against the worst batch, not the median: one long batch in a round
    # fills tmpfs and the round dies. A previous revision said 20 (2.1 TB) and
    # would have died partway through round 0.
    #
    # /!\ Do not repeat the units error this line used to contain: the batch
    # figures are GiB and a 1.5 "TB" budget is 1.5 TiB. Mixing them overstates the
    # ceiling by 7%, which is most of the margin.
    #
    # Worth knowing where the space goes: median row is 568 tokens but median
    # batch pads to ~7100, so ~92% of the cache is padding. TorchSpec exposes
    # `length_group_size` for exactly this and sets it to 1 (off); grouping by
    # length would shrink cached batches several-fold and cut the reload count
    # with it. Left off here to keep batch composition identical to the reference.
    #
    # Host RAM no longer binds: Phase B used to read a whole batch into every
    # rank's own memory, but _load_batch_from_disk now maps the tmpfs pages, so
    # the eight ranks share one copy instead of holding 8 x 103 GB.
    #
    # This also sets the wall clock. Phase B is 9.5 s/step against 104 s/batch of
    # Phase A prefill and an 11 min teacher reload per round, so what
    # cache_batches really buys is fewer reloads: 10 costs ~66 h of reloading
    # across the run, and every batch added takes ~6 h off that. Raise it only
    # against a measured round-0 cache directory, not against this arithmetic —
    # real batches pad to 7250-8165 rather than 8192, so there is maybe 10% of
    # slack, not a second batch's worth.
    cache_batches: 10
    cache_dir: /dev/shm/teacher_cache_atom
    # No gradient accumulation across batches. One cached batch = one optimizer
    # step. Effective GBS = train_global_batch_size = 128.
    grad_accum_steps: 1
    # TorchSpec dspark_loss_decay_gamma. Position decay w_k = exp(-k / gamma).
    loss_decay_gamma: 4.0
    # TorchSpec dspark_num_target_layers
    num_target_layers: 5
    # TorchSpec ttt_length / dflash_block_size. draft.block_size must agree: the
    # trainer reads spec_length but passes block_size to the model.
    spec_length: 7
    # /!\ Deliberately NOT TorchSpec's [7, 31, 47, 63, 87]. That is the repo's
    # example stage1 value; the *released* Inferact Kimi-K3-DSpark checkpoint —
    # the one measuring 26.13% — declares [2, 23, 47, 71, 89], and so did the
    # first LumenRL run.
    #
    # These ids are not training-only. ATOM reads them back at serving time
    # (atom/config.py -> dspark_target_layer_ids) to pick which target layers to
    # feed the draft, under the same "output of layer i" convention that
    # configure_hidden_states() captures with — so no +1 shift applies on this
    # path, whatever TorchSpec's own vLLM plumbing does.
    #
    # Keeping them is what makes this run's curves comparable to the first one's,
    # which is the only way to attribute a change to the attention fix rather
    # than to a different feature contract.
    aux_hidden_state_layer_ids: [2, 23, 47, 71, 89]
    capture_mode: postnorm
    # TorchSpec dspark_num_anchors, and the main driver of Phase B peak GPU
    # memory (57.8 GiB measured at 512 with the 2048 window).
    anchor_num: 512
    # /!\ Must be false on ATOM, the inverse of the vLLM variant, because the two
    # storage conventions differ:
    #   vLLM: splits the 5 aux layers into "first 4 -> hidden_states, 5th ->
    #     last_hidden_states", pre-norm, so the trainer has to rejoin them and
    #     apply RMSNorm itself.
    #   ATOM: hidden_states already holds all 5 layers (35840), and
    #     last_hidden_states is the model's final output with the final norm
    #     already applied (kimi_k3.py's forward ends in
    #     return self.norm(hidden_states)).
    # Setting it true makes the trainer concatenate once more -> fc receives
    # 6*7168=43008 instead of 5*7168, a straight shape error, and the norm gets
    # applied a second time.
    separate_last_hidden: false
    shift_input_embeds: false
    # TorchSpec dspark_ce_loss_alpha / _l1_loss_alpha / _confidence_head_alpha
    ce_loss_alpha: 0.1
    l1_loss_alpha: 0.9
    confidence_loss_alpha: 1.0
  teacher:
    model_name: /home/jimguo12/k3-target-official
    inference_backend: atom
    tensor_parallel_size: 8
    gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    quantization: ""
    # /!\ Off-policy prefill, changed from the first run's `generate`. The
    # responses were already written by K3 in a separate decode pass, so the
    # teacher only re-prefills prompt+response out of input_ids and captures
    # hidden states.
    #
    # Three consequences, all simplifications:
    #   - Phase A1 disappears; a round is extract + train, losing ~15.6 min.
    #   - dataset.max_prompt_tokens no longer has to be > 0 (it exists to emit
    #     prompt_ids for the generate path), so the whole-sequence length filter
    #     comes back on — see dataset.drop_overlong.
    #   - generate_max_tokens / generate_sweep_batches / generate_temperature are
    #     unused, and the block-table wedge that cost the first run two rounds
    #     (a row landing exactly on max_model_len) cannot fire.
    generate_mode: prefill
    transport: mooncake
    # ---- ATOM engine parameters (filtered onto atom.config.Config fields) ----
    # /!\ ATOM **silently discards** keys it does not recognise, so a misspelled
    # name fails without a word. atom_teacher_engine's worker therefore adds a
    # validation pass that raises on unknown keys.
    atom:
      max_model_len: 8192
      # /!\ Down from the first run's 256, which was tuned for decode throughput
      # at a 2048 window. There is no decode here, and each slot's state is 4x
      # larger. The 2026-08-14 serving benchmark hit this wall from the other
      # side: K3's KDA recurrent-state cache scales linearly with max_num_seqs
      # and at 64 slots wanted 28.9 GB per rank against a 19 GB budget. Prefill
      # concurrency is not the round's bottleneck; measure before raising it.
      max_num_seqs: 32
      # /!\ Must be >= max_model_len. Hidden states are written per scheduler
      # step, keyed on request id, and a second write to the same key overwrites
      # the first; if a sequence's prefill is split into several chunks, only the
      # last one survives. ATOM's own assertion for this is commented out, so
      # this guarantee is ours to keep (the worker checks it). 8192 is exactly
      # max_model_len, so the longest single sequence still lands in one scheduler
      # step and the guarantee holds. This is the floor: any lower and long rows
      # get chunked and silently lose all but their last chunk.
      #
      # /!\ This also sets the *transient* prefill activation peak, which is the
      # scarcest resource at a round restart. From the two budget lines the engine
      # prints (first start vs restart):
      #
      #                            first start   restart
      #   utilization                      0.9    0.9497
      #   budget                     226.79 GB  239.30 GB
      #   non_torch                   11.69 GB   23.61 GB
      #   KV + state pool             12.82 GB   13.41 GB
      #   left for activations        30.23 GB   17.72 GB
      #
      # The 11.92 GB jump in non_torch is the trainer's residual (DDP gradient
      # buckets, see the alignment log). _compensate_teacher_utilization hands
      # that back as budget so the KV pool stays viable, which is the only reason
      # the teacher starts at all — but the memory is not really there, so it is
      # taken out of activation headroom instead.
      #
      # 32768 failed outright. 16384 halved the peak exactly as intended (the
      # failing allocation went 3,732,930,560 -> 1,864,368,128 B) and still was
      # not enough: seven ranks reported 226-918 MB free at the moment of failure.
      # These are allocator *warnings*, not exceptions — the request never
      # completes and the engine crawls instead of dying, surfacing as "teacher
      # stopped responding to cmd=extract_hidden after 600.0s". Batches that
      # normally take 10-20 s took 57 s, 201 s, or blew the 600 s timeout; that
      # cost round 1 about 14 min and round 2 about 4 min, out of a 22 min round.
      #
      # 8192 halves the peak once more. Engine time roughly doubles, but prefill
      # is only ~12 s of a ~75 s batch, so the round pays ~9% to stop losing
      # 4-14 min of it. Do not raise this without first freeing the trainer's
      # residual — that residual is the width of the squeeze.
      max_num_batched_tokens: 8192
      # /!\ Must be false. Cache-hit prefixes are not counted in
      # scheduled_tokens, and hidden states only cover the tokens scheduled in
      # that step.
      enable_prefix_caching: false
      # /!\ Must be false. ATOM's _store_hidden_states does not check
      # is_final_chunk, so a chunked prefill writes every chunk to the same key
      # and only the last one survives.
      enable_chunked_prefill: false
      # 0.90 is the value for a *quiet* device, and the trainer now raises it per
      # start by whatever it still holds — see
      # _compensate_teacher_utilization(). Do not tune this to fix a restart
      # failure; the two starts want opposite values and no single one works.
      #
      # ATOM sizes KV as `utilization x total - weights - non_torch - 2% margin`,
      # where non_torch is `(total - free) - its_own_reserved` and so contains
      # everything *this* process holds. Measured here (252 GiB cards, weights
      # ~217.6 GiB per rank, ~13.6 GiB held after Phase B and the draft offload,
      # even across all eight ranks to within 0.4 GiB):
      #
      #   first start 0.94 -> KV 14.3 GiB, trainer left 20 GiB   ok
      #   first start 0.96 -> KV 19.3 GiB, trainer left 15 GiB   trainer OOMs
      #   restart     0.94 -> KV  0.7 GiB                        dies
      #   restart     0.96 -> KV  5.7 GiB                        ok
      #
      # /!\ Both failures were observed, in that order, on this node. 0.90 dies at
      # the restart with `InsufficientPoolBudget: state pool needs 1797488640B of
      # -7714532004B`, reported as `ModelRunner7/8 proc died (exitcode=1)` — a rank
      # index that invites a per-device memory theory. It is not one.
      gpu_memory_utilization: 0.90
      # /!\ fp8, matching serving. An earlier revision of this file set bf16 to
      # keep the labels clean, reasoning that fp8 saves only ~1.8 GB of the 250 GB
      # resident (0.6%, since only 24 of K3's 93 layers use the paged KV cache;
      # the other 69 are KDA recurrent state) while aiter_mla ties
      # dtype_q = dtype_kv and MLA prefill decompresses k/v from the paged cache,
      # so the noise lands in the 5 aux layers the draft regresses against.
      #
      # Every clause of that is true and the conclusion was still wrong, because
      # it never asked what the draft is served under. The benchmark that produced
      # both the 6.01% and the reference 26.13% ran the target with
      #   'kv_cache_dtype': 'fp8', 'index_cache_dtype': 'fp8'
      # (k3-bench/results/server_ropefix-official.log). Since prefill reads k/v
      # back out of the paged cache, extracting labels at bf16 and serving at fp8
      # means the draft is fitted to context features it will never see — the same
      # class of train/serve mismatch as the RoPE convention, and arrived at the
      # same way, by reasoning about one side in isolation.
      #
      # Clean labels are the wrong labels when the deployment target is quantized.
      kv_cache_dtype: fp8
      # Set for the same reason: serving sets it explicitly and ATOM's default is
      # None. /!\ Unlike kv_cache_dtype this one is not yet confirmed to touch the
      # prefill path at all, so it is matched on principle rather than on measured
      # effect. What is confirmed is that Phase A runs and trains with both set —
      # see the fp8 smoke run in the alignment log.
      index_cache_dtype: fp8
      # /!\ true here, unlike the first run, and it costs nothing: ATOM captures
      # graphs for decode shapes only (all 20 have max_q_len=1), and off-policy
      # prefill never decodes, so the 8.28 s of capture and 0.24 GB of pool would
      # buy exactly zero replays. TorchSpec's reference config also runs eager.
      enforce_eager: true
  draft:
    from_scratch: true
    # ---- Aligned with Inferact/Kimi-K3-DSpark/config.json ----
    num_layers: 5
    num_heads: 64
    num_kv_heads: 64
    head_dim: 128
    ffn_dim: 14336
    rms_norm_eps: 1.0e-5
    rope_theta: 50000.0
    # /!\ This rope block must stay byte-identical to the rope_parameters the
    # export writes into config.json, which is the published Inferact block.
    # ATOM reads it back to build the draft's rotary embedding and its softmax
    # scale, so trainer and server have to derive both from the same numbers.
    # output/export_dspark_hf.py cross-checks this file against what it emits and
    # refuses to export on a mismatch; selfcheck/verify_rope_alignment.py checks
    # the resulting numerics against ATOM's own get_rope.
    #
    # /!\ mscale/mscale_all_dim are 1.0, not 0.0. They cancel in the cos/sin
    # cache (which is scaled by their ratio) but they do NOT cancel in the
    # softmax scale, which both TorchSpec and ATOM widen by
    # yarn_get_mscale(factor, mscale_all_dim)^2 = 1.8133x. The first run's draft
    # had to be served with 0.0/0.0 to force ATOM down to the un-widened scale
    # the trainer was using; the trainer now applies the widening itself.
    rope_scaling_type: yarn
    rope_scaling_factor: 32.0
    rope_original_max_pos: 32768
    rope_beta_fast: 32.0
    rope_beta_slow: 1.0
    rope_mscale: 1.0
    rope_mscale_all_dim: 1.0
    use_aux_hidden_state: true
    use_input_layernorm_in_first_layer: true
    use_last_layernorm: true
    use_mtp_layernorm: false
    attention_bias: false
    mlp_bias: false
    dtype: bfloat16
    # ---- MLA dimensions (Inferact/Kimi-K3-DSpark) ----
    q_lora_rank: 1536
    kv_lora_rank: 512
    qk_nope_head_dim: 128
    qk_rope_head_dim: 64
    v_head_dim: 128
    # ---- DSpark-specific ----
    markov_rank: 256
    markov_head_type: vanilla
    enable_confidence_head: true
    confidence_head_with_markov: true
    mask_token_id: 163837
    block_size: 7

mooncake:
  protocol: tcp
  device_name: ""
  # /!\ Must hold the hidden states of one whole cached batch: Phase A writes the
  # entire batch before the consumer reads the first key, so it cannot be
  # reclaimed as it streams. Sizing, at (5 aux + 1 last) x 7168 x 2 B = 84 KB per
  # token:
  #   first run  bs=64,  T=2048 -> 0.16 GB/seq -> 10 GB/batch (32GB was 3x headroom)
  #   this run   bs=128, T=8192 -> 0.69 GB/seq -> 90 GB/batch worst case
  # 256GB keeps the same ~3x headroom against the worst case. Measured
  # 2026-07-31: undersizing returns code=-200 on write, evicts the oldest keys,
  # and the consumer dies after the retry window rather than reporting the cause.
  # /!\ Re-check this line whenever the batch size or the window changes.
  global_segment_size: 256GB
  # 16GB, from TorchSpec. Sized per *sequence*, not per batch — hidden states are
  # put per request — and a sequence grew 4x with the window.
  local_buffer_size: 16GB
  # The default was 90 seconds. Widening it is pure fault tolerance and does not
  # affect the normal path.
  get_retry_max_wait_seconds: 300.0

quantization:
  training:
    fp8: null
    lumen_norm: true
    lumen_linear: true
    hf_attn_patch: true
  rollout_correction:
    enabled: false

dataset:
  chat_template: kimi-k3
  # /!\ true, from TorchSpec (last_turn_loss_only), against the first run's
  # false. Supervising only the final assistant turn is what the reference recipe
  # trains, and in a cached on-policy set the final turn is the one K3 actually
  # wrote — earlier turns are dataset history, a different distribution.
  # This is part of the tokenize cache key, so changing it reprocesses.
  last_turn_loss_only: "true"
  # TorchSpec min_loss_tokens: DSpark needs at least two complete seven-token
  # diffusion blocks, so a row with fewer supervised tokens teaches nothing.
  min_loss_tokens: 14
  # The node has 256 cores. Each sample is rendered twice, so 16 workers are far
  # too slow for 470k samples, and this value is not part of the cache key.
  num_preprocess_workers: 96
  cache_dir: /dev/shm/lumenrl_cache
  # In prefill mode this is the filter that matters. dataset.py only checks the
  # total length when max_prompt_tokens <= 0 (with mpt>0 the reference answer
  # takes no part in training, so its length must not eliminate a sample) — and
  # here the reference answer *is* the training data, so the check has to be on.
  # Rows longer than max_total_sequence_length are dropped rather than truncated:
  # a truncated conversation stops mid-sentence with no terminator, and what the
  # draft would learn is to continue text the teacher never produced.
  drop_overlong: true
  # /!\ 0, not the first run's 1024. Non-zero exists to emit prompt_ids for the
  # generate path; setting it here would both waste a rendering pass and, per the
  # note above, disable the total-length filter off-policy prefill depends on.
  #
  # It also un-does the first run's biggest data limitation. At mpt=1024 with
  # thinking=true, multi-turn rows (prompt p50 = 3179 tokens once history
  # reasoning is preserved) were almost entirely dropped and the training set was
  # effectively single-turn. With the filter moved to the whole sequence against
  # an 8192 window, most of them survive.
  max_prompt_tokens: 0
  # /!\ Must be true. K3 is a preserved-thinking model and reasoning_effort only
  # supports max: apply_chat_template's thinking argument controls which channel
  # the decode starts on (<|open|>think<|sep|> versus <|open|>response<|sep|>),
  # so thinking=false pins the model on a starting point it was never trained
  # for, and reasoning_content in multi-turn history gets stripped as well.
  #
  # /!\ Depends on the kimi_k3_parser fix (PARSER_VERSION=6): before it,
  # _prepare_messages unconditionally stripped reasoning from non-final assistant
  # turns, so thinking=true rendered a string of empty think blocks. Old caches
  # must be invalidated through PARSER_VERSION and must not be reused.
  thinking: true

reward:
  type: function
  function: math_reward
  # slippedJim/ATOM_regen_seeklight_kimi_mtp — every final assistant turn in
  # lightseekorg/kimi-mtp-dataset regenerated by K3 itself, which is what makes
  # this a cached on-policy run: the teacher decoded once, offline, and Phase A1
  # is gone from the loop for good.
  #
  # Full release, with the image rows removed: 450,625 raw rows minus the 122,812
  # (27.25%) carrying an `image_url` content part, leaving 327,813. The release
  # inherits multimodal conversations from its source, and their user turns encode
  # content as a JSON parts list holding a COCO image URL. Nothing in this
  # pipeline fetches an image, so the draft was being asked to predict K3's answer
  # to a question whose subject it could not see — a quarter of the tokens
  # teaching it to guess from the text stub alone.
  #
  # The filter keys on an explicit media-type set, not on `type != "text"`:
  # 115 rows are plain-text answers that happen to parse as JSON lists (a bare
  # `126`, a task-planning object) and the looser predicate deletes them. Rows
  # that only discuss a modality in prose are also kept — 1,012 asking about HTML
  # <img>, 52 embedding base64 CSS textures, 148 using markdown image syntax for
  # placeholders. Those are text coding data whose answers never depend on seeing
  # a picture. Regenerate with filter_multimodal.py if the release is refreshed.
  #
  # /!\ Prompts are verbatim from the source dataset and only the last turn is
  # K3's, which is why dataset.last_turn_loss_only must stay true — see there.
  #
  # Pre-shuffling the file is not required: load_and_preprocess_dataset shuffles
  # with seed=42 before tokenizing, so the sequential sampler already walks a
  # random order. It is also harmless. The shuffle is also why filtering the file
  # is enough to clean the eval slice: eval is the tail of the shuffled set, so it
  # is drawn from the same filtered pool rather than held out separately.
  dataset: /dev/shm/atom-regen-kimi-mtp-textonly/train.jsonl

eval:
  enabled: true
  # Once per round at cache_batches=10. The first run used 100 with 50-step
  # rounds (every other round) and could not read a trend out of it.
  interval: 10
  # /!\ Raised from the first run's 32, which left eval noise (+/-0.015) as large
  # as the 100-step signal it was meant to measure. Two amplifiers: 32 is simply
  # a small sample, and AL is a sum of cumulative products over 7 positions
  # (~p0 x 1.76), which magnifies p0's relative movement about 2x.
  #
  # The ceiling is host RAM: every rank keeps a full copy, so a sample costs
  # 8 x 84 KB per token. 128 is provisional — confirm against the smoke run's
  # measured Phase B peak before a long run.
  num_samples: 128
  micro_batch_size: 2

checkpointing:
  # /dev/shm is wiped along with the allocation, so checkpoints have to land on
  # real storage (the launch script overrides this with CKPT_DIR).
  checkpoint_dir: /dev/shm/checkpoints/kimi_k3_dspark_atom
  # Aligned with cache_batches=10, i.e. once per round, landing exactly on a
  # round boundary: recovery starts from the boundary and no half a Phase A is
  # wasted. The teacher cache lives in /dev/shm and is gone the moment the node
  # is, so the current round's Phase A always has to be redone.
  save_steps: 10
  # A checkpoint is 31 GiB (33.4 GB measured: bf16 weights + fp32 master + Adam
  # m/v over 2.39B params), so 12 of them is ~400 GB and has to land on real
  # storage, not the tmpfs this line names — run_docker.sh overrides it with
  # CKPT_DIR for exactly that reason. At save_steps=10 this is 120 steps of
  # rollback room, not the 240 it was when save_steps was 20;
  # the first run needed exactly that when a suspicious stretch of the eval
  # curve had to be recomputed and the checkpoint had already been pruned.
  save_total_limit: 12
  # /!\ This line is overridden and is not what the live run uses. Until
  # 2026-08-19 the comment here claimed run_docker.sh passed
  # checkpointing.resume=true in EXTRA_OVERRIDES; it did not, and neither did
  # run_kimi_k3.sh, so this false won every time. The override is real now —
  # run_kimi_k3.sh passes checkpointing.resume=${RESUME:-true} — and the reason it
  # has to exist is that run_docker.sh starts the container with
  # --restart=on-failure:40: without it, a crash comes back up training from step
  # 0 while the checkpoints it should have resumed from sit in CKPT_DIR untouched,
  # and nothing in the log says so.
  #
  # Leaving false here is still right as the file-level default: it is what a
  # bare `python -m lumenrl.trainer.main --config train.yaml` should do, since
  # resume: true would quietly pick up an old checkpoint and continue in what was
  # meant to be a new run. The launcher is where "this is a long crash-prone run,
  # come back where you left off" belongs.
  #
  # _resume_from_checkpoint takes the highest-numbered checkpoint and restores
  # global_step, optimizer state and the LR schedule; the data offset is derived
  # from global_step, so the sampler continues instead of replaying rows.
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

# Measured 2026-08-19 against the image-filtered full release (327,813 rows, see
# reward.dataset): **307,278** survivors at an 8192 window, the 20,535 dropped all
# for exceeding it. One epoch is floor((307278 - 128) / 128) = 2399 steps.
#
# **1 epoch = 2399**, down from the 3358 the unfiltered release supported: removing
# 27% of the rows removes 27% of the epoch. At the measured 2.2 min/step that is
# ~3.7 days. Checkpoints land every 10 steps, so this is a ceiling to stop against
# rather than a commitment to run to the end.
#
# 2399 is also the largest count that stays inside one epoch, so the sampler never
# wraps and P10's eval-slice leak cannot arise at all — it covers rows 0..307071
# against an eval slice starting at 307150. Going beyond one epoch is allowed (the
# sampler wraps at (step*bs) % _trainable_len() deliberately) but then correctness
# depends on _trainable_len() excluding the held-out tail; inside one epoch it
# does not depend on anything.
#
# /!\ warmup_ratio is a fraction of this number, so shortening the run shortens
# warmup with it: 0.04 x 2399 = 96 steps, against 134 at 3358 and gen-2's 66. That
# is intended — warmup is being held at a constant share of the schedule — but it
# means a step-for-step comparison against a differently-sized run is confounded
# by the LR schedule for the first few hundred steps. Compare by schedule fraction.
#
# Filtering moved the length distribution *up*, which is worth knowing because it
# sets Phase A's transfer cost: mean 1852 / p50 785 / p90 5286 / p99 7752, against
# the unfiltered mean 1695 / p90 4570. The image rows were short (a URL and a one-
# line question), so dropping them removed mostly short samples. The padded cached
# batch did not move (worst 98.0 GiB, same as before) because batches pad to their
# own longest row and the tail dominates that, not the mean — so cache_batches
# stays at 10, now one under its ceiling of 11 rather than at it.
#
# Recompute after changing the dataset or any field in the tokenize cache key
# (max_length, max_prompt_tokens, last_turn_loss_only, min_loss_tokens,
# thinking). The arguments must match this file exactly, or preprocessing builds
# a second cache and the run pays for it twice:
#   python3 examples/Kimi_K3_SDDD_MI350_ATOM/selfcheck/preprocess_dataset.py \
#       --dataset /dev/shm/atom-regen-kimi-mtp-textonly/train.jsonl \
#       --tokenizer /mnt/nvme1/jimguo12/k3-target-official \
#       --max-length 8192 --max-prompt-tokens 0 \
#       --thinking true --last-turn-loss-only true --min-loss-tokens 14 \
#       --eval-samples 128 --batch-size 128
num_training_steps: 2399
# TorchSpec seed
seed: 42

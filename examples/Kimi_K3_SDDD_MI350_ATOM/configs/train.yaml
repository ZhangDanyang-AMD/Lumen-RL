# Kimi K3 DSpark SDDD — MI350 (4x ATOM TP=8 teachers + 1x 8-GPU draft)
#
# Four resident Ray actors each own one ATOM TP=8 node. Whole batches are sent
# round-robin; every actor prefills the response stored in the dataset and
# extracts hidden states. There is no teacher decode sweep.
# The 8-rank draft node consumes disjoint per-sequence keys through pinned-host
# Mooncake RDMA while teachers continue producing into a bounded queue.
#
# Usage:
#   sbatch examples/Kimi_K3_SDDD_MI350_ATOM/run_multinode_slurm.sh

cluster:
  gpus_per_node: 8
  num_nodes: 1

policy:
  model_name: /mnt/m2m_nobackup/jimguo12/models/Kimi-K3
  training_backend: fsdp2
  generation_backend: hf
  # Aligned with Jim's TorchSpec-derived cached-on-policy recipe. 8192 retains
  # 98.7% of the measured regenerated dataset while keeping prefill memory below
  # the 16384-token worst case.
  max_total_sequence_length: 8192
  # Keep this optimizer block as a unit: it is the TorchSpec reference recipe.
  train_global_batch_size: 128
  train_micro_batch_size: 1
  learning_rate: 5.0e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  # /!\ Not 0. gen-3 ran a single epoch with min_lr 0, so cosine took the lr to
  # 7.6e-10 and eval AL flattened at 1.613-1.617 from step 3300 on -- a schedule
  # artefact, not data exhaustion, and it is why a second epoch cannot simply be
  # appended. This run decays only as far as a three-epoch cosine would have by
  # the end of its first epoch: decay_ratio = (1 - 0.04*3) / (3 - 0.04*3)
  # = 0.3056, coeff = 0.5*(1 + cos(0.3056*pi)) = 0.7868, so 0.7868 * 5e-5.
  min_lr: 3.93e-5
  warmup_ratio: 0.04
  lr_decay_style: cosine

algorithm:
  name: spec_distill
  spec_distill:
    draft_type: dspark
    loss_type: dspark
    sequential_mode: streaming_disaggregated
    teacher_replicas: 4
    teacher_actor_prefix: kimi-k3-sddd-teacher
    # Two queued batches per replica keeps all four teachers busy while the
    # draft consumes the oldest completed batch.
    stream_prefetch_batches: 8
    # The launcher overrides this onto the shared DATA_ROOT volume.
    teacher_weights_path: /data/cache/kimi_k3_teacher_static_weights.pt
    # DSpark position decay: w_k = exp(-k / gamma)
    loss_decay_gamma: 4.0
    num_target_layers: 5
    spec_length: 7
    # /!\ These five layers are the draft's feature contract; the teacher must
    # capture exactly the same five. ATOM's hook captures hidden_states +
    # residual (the post-layer residual stream), which is semantically equal to
    # capture_mode: postnorm, and ATOM's own DSpark checkpoint came out of this
    # path. Changing the layers means changing num_target_layers and the draft's
    # input width along with it.
    aux_hidden_state_layer_ids: [2, 23, 47, 71, 89]
    capture_mode: postnorm
    # anchor_num is the main driver of peak memory (57.8 GiB measured at 512).
    anchor_num: 512
    # /!\ Must be false on ATOM, the inverse of the vLLM variant, because the two
    # storage conventions differ:
    #   vLLM: splits the 5 aux layers into "first 4 -> hidden_states, 5th ->
    #     last_hidden_states", pre-norm, so the trainer has to rejoin them and
    #     apply RMSNorm itself.
    #   ATOM: hidden_states already holds all 5 layers (35840), and
    #     last_hidden_states is the model's final output with the final norm
    #     already applied (kimi_k3.py's forward ends in
    #     return self.norm(hidden_states)).
    # Setting it true makes the trainer concatenate once more -> fc receives
    # 6*7168=43008 instead of 5*7168, a straight shape error, and the norm gets
    # applied a second time.
    separate_last_hidden: false
    shift_input_embeds: false
    # DSpark loss weights
    ce_loss_alpha: 0.1
    l1_loss_alpha: 0.9
    confidence_loss_alpha: 1.0
  teacher:
    model_name: /mnt/m2m_nobackup/jimguo12/models/Kimi-K3
    inference_backend: atom
    tensor_parallel_size: 8
    gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    quantization: ""
    # Off-policy: use the Kimi-K3 responses already stored in
    # slippedJim/ATOM_regen_seeklight_kimi_mtp. Teachers only prefill and publish
    # hidden states; A1 decode is intentionally skipped.
    generate_mode: prefill
    transport: mooncake
    # ATOM prefill settings aligned with Jim's cache-on-policy branch. Chunking
    # and prefix caching must remain disabled because extraction is keyed by
    # request and a later write would overwrite an earlier partial span.
    atom:
      max_model_len: 8192
      # There is no decode sweep. At this window, 32 slots avoids over-allocating
      # K3's recurrent state while still allowing concurrent prefill requests.
      max_num_seqs: 32
      # Exactly one full sequence per scheduler step; lowering this silently
      # truncates captured hidden states.
      max_num_batched_tokens: 8192
      enable_prefix_caching: false
      enable_chunked_prefill: false
      gpu_memory_utilization: 0.90
      # Match the target's serving precision so the draft sees the same context
      # features during training and deployment.
      kv_cache_dtype: fp8
      index_cache_dtype: fp8
      enforce_eager: true
  draft:
    # Continuing gen-3 (step 3358, 1 epoch on the regenerated kimi-mtp set,
    # eval AL 1.617), not starting over. The directory holds the ATOM-format
    # export; the trainer maps context_proj/context_norm/final_norm back to
    # fc/hidden_norm/norm and refuses to start if any draft parameter would be
    # left at its random initialisation. The 33 GB training_checkpoint/ in the
    # same repo carries optimizer state too, but eight ranks reading it is
    # 267 GB for weights that the 7.1 GB export already holds losslessly.
    from_scratch: false
    resume_from: /shared_nfs/jimguo12/lumenrl/drafts/off_policy_k3_draft
    # ---- Aligned with Inferact/Kimi-K3-DSpark/config.json ----
    num_layers: 5
    num_heads: 64
    num_kv_heads: 64
    head_dim: 128
    ffn_dim: 14336
    rms_norm_eps: 1.0e-5
    rope_theta: 50000.0
    rope_scaling_type: yarn
    rope_scaling_factor: 32.0
    rope_original_max_pos: 32768
    rope_beta_fast: 32.0
    rope_beta_slow: 1.0
    rope_mscale: 1.0
    rope_mscale_all_dim: 1.0
    use_aux_hidden_state: true
    use_input_layernorm_in_first_layer: true
    use_last_layernorm: true
    use_mtp_layernorm: false
    attention_bias: false
    mlp_bias: false
    dtype: bfloat16
    # ---- MLA dimensions (Inferact/Kimi-K3-DSpark) ----
    q_lora_rank: 1536
    kv_lora_rank: 512
    qk_nope_head_dim: 128
    qk_rope_head_dim: 64
    v_head_dim: 128
    # ---- DSpark-specific ----
    markov_rank: 256
    markov_head_type: vanilla
    enable_confidence_head: true
    confidence_head_with_markov: true
    mask_token_id: 163837
    block_size: 7

mooncake:
  # /!\ TCP, not RDMA. Ionic allows one RDMA client per HCA per process: the
  # second registration on a device fails with EINVAL (reproduced with
  # selfcheck/time_mooncake_pool.py --devices ionic_0 --stores 3). With seven
  # HCAs a teacher's producer pool therefore tops out at 7 x 2 GiB = 14 GiB,
  # while one batch of 128 sequences publishes about 24 GiB at this dataset's
  # mean length, so the producer can never place a whole batch and the request
  # never completes -- observed as extract_hidden timing out at 600 s with zero
  # steps done on 2026-08-24. TCP has no memory-region limit and measured
  # 2.0 GiB/s put plus 4.44 GiB/s cross-node get with eight fetchers, roughly
  # 5 s per batch against a ~44 s draft step.
  protocol: tcp
  # Empty under TCP. Only NCCL (draft gradients, intra-node) uses the HCAs, and
  # the hosts expose ionic_0..6 -- there is no ionic_7.
  device_name: ""
  enable_gpu_direct: false
  enable_hard_pin: true
  # One teacher segment holds every batch that teacher has in flight: about
  # 24 GiB per batch, 88 GiB in the 8192-token worst case, two batches per
  # replica at stream_prefetch_batches=8. Host RAM is 2.8 TB and the segment is
  # only touched lazily. The launcher overrides this per role; draft ranks get a
  # small segment because they only read.
  global_segment_size: 128GB
  # Staging buffer for the largest per-sequence payload, about 672 MiB at 8192
  # tokens x (5 aux + 1 final) x 7168 x bf16.
  local_buffer_size: 8GB
  # The default was 90 seconds. Widening it to 300 is pure fault tolerance and
  # does not affect the normal path.
  get_retry_max_wait_seconds: 300.0

quantization:
  training:
    fp8: null
    lumen_norm: true
    lumen_linear: true
    hf_attn_patch: true
  rollout_correction:
    enabled: false

dataset:
  chat_template: kimi-k3
  # The regenerated final assistant turn is K3 output; earlier assistant turns
  # are conversation history and are not part of this distillation target.
  last_turn_loss_only: "true"
  min_loss_tokens: 14
  # Rendering the full 450k-sample conversation dataset is CPU-heavy.
  num_preprocess_workers: 96
  cache_dir: /dev/shm/lumenrl_cache
  # The complete stored response must fit; do not train on a truncated answer.
  drop_overlong: true
  # Zero selects full input_ids + dataset assistant loss mask instead of
  # generating prompt_ids for an on-policy decode.
  max_prompt_tokens: 0
  # /!\ Must be true. K3 is a preserved-thinking model and reasoning_effort only
  # supports max: apply_chat_template's thinking argument controls which channel
  # the decode starts on (<|open|>think<|sep|> versus <|open|>response<|sep|>),
  # so thinking=false pins the model on a starting point it was never trained
  # for, and reasoning_content in multi-turn history gets stripped as well.
  #
  # It was previously set false on the argument that "the think block will eat
  # the 1000-token budget and leave no response at all". Measurement does not
  # support that: K3's output has a median of only 398 tokens, and **truncation
  # is harmless for speculative distillation** (see teacher.generate_max_tokens).
  # Even with 26% of rows hitting the cap at 1024, what got capped is still
  # entirely tokens the teacher really produced, so it remains valid supervision.
  #
  # /!\ Depends on the kimi_k3_parser fix (PARSER_VERSION=6): before it,
  # _prepare_messages unconditionally stripped reasoning from non-final assistant
  # turns, so thinking=true rendered a string of empty think blocks. Old caches
  # must be invalidated through PARSER_VERSION and must not be reused.
  thinking: true

reward:
  type: function
  function: math_reward
  # ATOM-regenerated nine-category pool: 364,767 rows, single-turn, image turns
  # filtered at generation time. 345,476 survive the 8192 window (5.3% dropped
  # for exceeding it, which is the intended filter -- max_prompt_tokens 0 with
  # drop_overlong makes an overlong row a drop, not a truncation).
  dataset: /shared_nfs/jimguo12/lumenrl/datasets/nine_category/train.jsonl

eval:
  enabled: true
  # 10 matches gen-3, whose curve is the one this run is measured against. In the
  # disaggregated topology each rank holds only num_samples/world_size rows, so
  # an eval point costs about a tenth of the 77 s it did when all eight ranks
  # evaluated the whole slice.
  interval: 10
  # 128, same as gen-3. In this topology the slice is sharded across the eight
  # draft ranks instead of replicated, so the old "each sample costs 1.2 GB on
  # every rank" ceiling no longer binds; 128 is kept for comparability, not
  # because of memory. Must stay a multiple of world_size * micro_batch_size.
  num_samples: 128
  micro_batch_size: 2
  # /!\ The slice above is the tail of *this* run's training set, so its AL is
  # not comparable with gen-3's 1.617 -- that was measured on the tail of the
  # regenerated kimi-mtp set. Carry those exact 128 rows along as a second,
  # fixed yardstick. Built by selfcheck/build_eval_slice.py with gen-3's
  # dataset, seed and preprocessing parameters; the file records a fingerprint
  # of the rows so a silent drift is detectable.
  #   eval/*     -> nine-category tail, the new distribution
  #   eval_old/* -> gen-3's slice, directly comparable to 1.617
  extra_slices:
    - path: /shared_nfs/jimguo12/lumenrl/eval/gen3_old_128.pt
      prefix: eval_old

checkpointing:
  # The multinode launcher overrides this onto shared persistent storage.
  checkpoint_dir: /dev/shm/checkpoints/kimi_k3_dspark_atom
  # Each save is a 33 GB write to shared NFS on the critical path, and the
  # measured step time here is about 12 s, so every 50 steps would spend a large
  # fraction of the run writing. 100 steps is ~20 min of granularity.
  save_steps: 100
  # Keep every checkpoint of the run: 2698 steps / 100 = 27 saves x 33 GB is
  # under 900 GB against 29 TB free. The eval curve decides which one to export,
  # and pruning has already cost this project a recomputation once -- a
  # suspicious stretch of curve needed step 2400 and it had been deleted.
  save_total_limit: 30
  # The default of true will quietly pick up an old checkpoint and continue in
  # what was meant to be a new run, without complaining. Always set it off
  # explicitly for a fresh run.
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

# One epoch. selfcheck/preprocess_dataset.py measured 345,476 survivors of the
# 364,767-row nine-category set at this 8192-token recipe; minus the 128 eval
# rows that is floor((345476 - 128) / 128) = 2698 steps at global batch 128.
# Recompute with that script whenever the staged dataset changes -- the number
# also bounds the sampler away from the eval tail (_trainable_len).
num_training_steps: 2698
seed: 42

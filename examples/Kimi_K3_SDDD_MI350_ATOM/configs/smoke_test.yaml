# Kimi K3 five-node disaggregated smoke test.
# Five optimizer steps exercise all four whole-batch teacher replicas, the
# prefill-only actor API, Mooncake RDMA, and draft-rank key sharding.

cluster:
  gpus_per_node: 8
  num_nodes: 1

policy:
  model_name: /mnt/m2m_nobackup/danyzhan/models/Kimi-K3
  training_backend: fsdp2
  generation_backend: hf
  # Keep the smoke shape identical to the TorchSpec-aligned training recipe.
  max_total_sequence_length: 8192
  train_global_batch_size: 128
  train_micro_batch_size: 1
  learning_rate: 5.0e-5
  min_lr: 0.0
  lr_decay_style: cosine
  weight_decay: 0.0
  max_grad_norm: 1.0
  warmup_ratio: 0.04

algorithm:
  name: spec_distill
  spec_distill:
    draft_type: dspark
    loss_type: dspark
    sequential_mode: streaming_disaggregated
    teacher_replicas: 4
    teacher_actor_prefix: kimi-k3-sddd-teacher
    stream_prefetch_batches: 5
    teacher_weights_path: /data/cache/kimi_k3_teacher_static_weights.pt
    loss_decay_gamma: 4.0
    num_target_layers: 5
    spec_length: 7
    # Same as train.yaml: these five layers are the draft's feature contract and
    # the teacher must capture the same set.
    aux_hidden_state_layer_ids: [2, 23, 47, 71, 89]
    capture_mode: postnorm
    # Same as train.yaml. anchor_num is the main driver of peak memory (57.8 GiB
    # measured at 512); smoking with 64 would hide the real run's OOM risk.
    anchor_num: 512
    # /!\ Must be false on ATOM (the inverse of the vLLM variant): ATOM's
    # hidden_states already holds all 5 layers and last_hidden_states has passed
    # the final norm. true would make fc receive 43008 instead of 35840. See the
    # note in train.yaml.
    separate_last_hidden: false
    shift_input_embeds: false
    ce_loss_alpha: 0.1
    l1_loss_alpha: 0.9
    confidence_loss_alpha: 1.0
  teacher:
    model_name: /mnt/m2m_nobackup/danyzhan/models/Kimi-K3
    inference_backend: atom
    tensor_parallel_size: 8
    gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    quantization: ""
    # Use the assistant response stored in the regenerated off-policy dataset.
    generate_mode: prefill
    transport: mooncake
    # Same off-policy prefill settings as train.yaml.
    atom:
      max_model_len: 8192
      max_num_seqs: 32
      # Must cover one full sequence or extraction would retain only the final
      # chunk under the request key.
      max_num_batched_tokens: 8192
      enable_prefix_caching: false
      enable_chunked_prefill: false
      gpu_memory_utilization: 0.90
      kv_cache_dtype: fp8
      index_cache_dtype: fp8
      enforce_eager: true
  draft:
    from_scratch: true
    num_layers: 5
    num_heads: 64
    num_kv_heads: 64
    head_dim: 128
    ffn_dim: 14336
    rms_norm_eps: 1.0e-5
    rope_theta: 50000.0
    rope_scaling_type: yarn
    rope_scaling_factor: 32.0
    rope_original_max_pos: 32768
    rope_beta_fast: 32.0
    rope_beta_slow: 1.0
    rope_mscale: 1.0
    rope_mscale_all_dim: 1.0
    use_aux_hidden_state: true
    use_input_layernorm_in_first_layer: true
    use_last_layernorm: true
    use_mtp_layernorm: false
    attention_bias: false
    mlp_bias: false
    dtype: bfloat16
    q_lora_rank: 1536
    kv_lora_rank: 512
    qk_nope_head_dim: 128
    qk_rope_head_dim: 64
    v_head_dim: 128
    markov_rank: 256
    markov_head_type: vanilla
    enable_confidence_head: true
    confidence_head_with_markov: true
    mask_token_id: 163837
    block_size: 7

mooncake:
  protocol: rdma
  device_name: ""
  enable_gpu_direct: false
  enable_hard_pin: true
  global_segment_size: 512GB
  local_buffer_size: 1GB
  get_retry_max_wait_seconds: 300.0

quantization:
  training:
    fp8: null
    lumen_norm: true
    lumen_linear: true
    hf_attn_patch: true
  rollout_correction:
    enabled: false

dataset:
  chat_template: kimi-k3
  last_turn_loss_only: "true"
  min_loss_tokens: 14
  # Only rank 0 builds the shared cache; keep smoke setup modest.
  num_preprocess_workers: 16
  cache_dir: /dev/shm/lumenrl_cache
  # These fields must match train.yaml so smoke validates the same token cache.
  drop_overlong: true
  max_prompt_tokens: 0
  # /!\ Must be true and must match train.yaml. thinking decides whether the
  # decode starts on the think or the response channel; false renders a different
  # dataset under a different cache key.
  # The smoke run should confirm the rendering while it is at it: the prompt in
  # the log should contain <|open|>think<|sep|>.
  thinking: true

eval:
  enabled: false
  interval: 1
  num_samples: 8
  micro_batch_size: 2

reward:
  type: function
  function: math_reward
  dataset: /mnt/m2m_nobackup/danyzhan/datasets/ATOM_regen_seeklight_kimi_mtp/data/train.jsonl

checkpointing:
  checkpoint_dir: /dev/shm/checkpoints/kimi_k3_dspark_atom_smoke
  save_steps: 9999
  save_total_limit: 1
  resume: false

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 5
seed: 42

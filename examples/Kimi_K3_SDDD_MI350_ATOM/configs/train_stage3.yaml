# Kimi K3 DSpark SDDD — MI350 (4x ATOM TP=8 teachers + 1x 8-GPU draft)
#
# Four resident Ray actors each own one ATOM TP=8 node. Whole batches are sent
# round-robin; every actor prefills the response stored in the dataset and
# extracts hidden states. There is no teacher decode sweep.
# The 8-rank draft node consumes disjoint per-sequence keys through pinned-host
# Mooncake RDMA while teachers continue producing into a bounded queue.
#
# gen-7：第二个 epoch。从 gen-6 的 checkpoint_49000 续训 19,283 步，语料是
# gen-5 去掉 80% 多语种之后与 gen-6 的并集（2,468,457 行存活），窗口仍是 32768。
# lr 走 cosine（不是 gen-6 的 WSD），入口 1.0009e-05 接上 gen-6 的退火终点。
#
# Usage:
#   bash /home/jimguo12/k3_train/launch_stage3.sh
#   VERIFY=1 bash /home/jimguo12/k3_train/launch_stage3.sh   # lr=0 校验

cluster:
  gpus_per_node: 8
  num_nodes: 1

policy:
  model_name: /mnt/m2m_nobackup/jimguo12/models/Kimi-K3
  training_backend: fsdp2
  generation_backend: hf
  # 32768：gen-7 语料在这个口径下存活 2,468,457 / 2,468,462 = 99.9998%。
  # 降到 16384 会丢 0.7%、8192 会丢 6.6%，而丢掉的正是 gen-6 补进来的长样本。
  max_total_sequence_length: 32768
  # Keep this optimizer block as a unit: it is the TorchSpec reference recipe.
  train_global_batch_size: 128
  train_micro_batch_size: 1
  # /!\ 这个峰值永远不会被走到。cosine 从 49,000 步切进去时 decay_ratio 已经是
  # 0.70584、coeff 0.19874，实际入口 lr = min_lr + coeff*(max_lr-min_lr)
  # = 1.0009e-05 —— 正好接上 gen-6 WSD 退火的终点 1.0e-5，不制造 re-warming 凹陷。
  # 4.23e-5 是按这个入口目标反解出来的（k3_train/lr_plan.py），不是挑的。
  #
  # /!\ 所以这份配置**只能用于从 49,000 步续训**。拿它从零训会真的把 lr 升到
  # 4.23e-5，那是另一回事。
  learning_rate: 4.23e-5
  weight_decay: 0.0
  max_grad_norm: 1.0
  # /!\ Not 0. gen-3 ran a single epoch with min_lr 0, so cosine took the lr to
  # 7.6e-10 and eval AL flattened at 1.613-1.617 from step 3300 on -- a schedule
  # artefact, not data exhaustion, and it is why a second epoch cannot simply be
  # appended.
  #
  # 2.0e-6 是给 gen-8 留的续训入场券。每一代的 min_lr 在往下走（gen-6 1.0e-5 ->
  # gen-7 2.0e-6），这是退火阶梯的本性；再往下几代就接近冻结了，到时候要么换
  # 语料重开一条 run，要么接受它已经收敛。
  min_lr: 2.0e-6
  warmup_ratio: 0.04
  # cosine，不是 gen-6 的 WSD。代价是入口和收尾被绑死（见上面 learning_rate 的
  # 注释），好处是整条曲线单调下降、跨代接得上，不需要再挑一个恒定段的 lr。
  # wsd_decay_ratio / wsd_decay_style 在 decay_style != WSD 时不被读取
  # （bf16_optimizer 只在 WSD 分支传它们），所以直接删掉，不留死配置。
  lr_decay_style: cosine

algorithm:
  name: spec_distill
  spec_distill:
    draft_type: dspark
    loss_type: dspark
    sequential_mode: streaming_disaggregated
    teacher_replicas: 4
    teacher_actor_prefix: kimi-k3-sddd-teacher
    # Two queued batches per replica keeps all four teachers busy while the
    # draft consumes the oldest completed batch.
    stream_prefetch_batches: 8
    # The launcher overrides this onto the shared DATA_ROOT volume.
    teacher_weights_path: /data/cache/kimi_k3_teacher_static_weights.pt
    # DSpark position decay: w_k = exp(-k / gamma)
    loss_decay_gamma: 4.0
    num_target_layers: 5
    spec_length: 7
    # /!\ These five layers are the draft's feature contract; the teacher must
    # capture exactly the same five. ATOM's hook captures hidden_states +
    # residual (the post-layer residual stream), which is semantically equal to
    # capture_mode: postnorm, and ATOM's own DSpark checkpoint came out of this
    # path. Changing the layers means changing num_target_layers and the draft's
    # input width along with it.
    aux_hidden_state_layer_ids: [2, 23, 47, 71, 89]
    capture_mode: postnorm
    # anchor_num is the main driver of peak memory (57.8 GiB measured at 512).
    anchor_num: 512
    # /!\ Must be false on ATOM, the inverse of the vLLM variant, because the two
    # storage conventions differ:
    #   vLLM: splits the 5 aux layers into "first 4 -> hidden_states, 5th ->
    #     last_hidden_states", pre-norm, so the trainer has to rejoin them and
    #     apply RMSNorm itself.
    #   ATOM: hidden_states already holds all 5 layers (35840), and
    #     last_hidden_states is the model's final output with the final norm
    #     already applied (kimi_k3.py's forward ends in
    #     return self.norm(hidden_states)).
    # Setting it true makes the trainer concatenate once more -> fc receives
    # 6*7168=43008 instead of 5*7168, a straight shape error, and the norm gets
    # applied a second time.
    separate_last_hidden: false
    shift_input_embeds: false
    # DSpark loss weights
    ce_loss_alpha: 0.1
    l1_loss_alpha: 0.9
    confidence_loss_alpha: 1.0
  teacher:
    model_name: /mnt/m2m_nobackup/jimguo12/models/Kimi-K3
    inference_backend: atom
    tensor_parallel_size: 8
    gpu_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    quantization: ""
    # Off-policy: use the Kimi-K3 responses already stored in
    # slippedJim/ATOM_regen_seeklight_kimi_mtp. Teachers only prefill and publish
    # hidden states; A1 decode is intentionally skipped.
    generate_mode: prefill
    transport: mooncake
    # ATOM prefill settings aligned with Jim's cache-on-policy branch. Chunking
    # and prefix caching must remain disabled because extraction is keyed by
    # request and a later write would overwrite an earlier partial span.
    atom:
      max_model_len: 32768
      # There is no decode sweep. At this window, 32 slots avoids over-allocating
      # K3's recurrent state while still allowing concurrent prefill requests.
      # /!\ 32 -> 24 是为了绕开一个确定可复现的挂死，不是为了省显存。
      # 现象：训练五次全部精确停在 step 41570，teacher 的 extract_hidden 600s 超时。
      # 卡死前最后一批在三次失败里逐字相同 —— "18 reqs, 26800 new tokens" —— 之后
      # 日志刷出 16 条
      #   FlyDSL kernel 'flydsl_gemm2_abf16_wbf16_bf16_t32x64x256_split_k7_...gfx950'
      #   from tuned config is not recognized by the current catalog
      # 然后 8 个 TP rank 全卡在集合通信里。失败的 run 必有这 16 条、成功的 run
      # 必定 0 条，一一对应。aiter 在这个 GEMM 形状上从调优表查到一个当前 catalog
      # 不认识的 kernel，回退时死锁。
      # 排除过的：不是机器（我一度误判成 043 坏了，白换一轮），也不是数据
      # （那几批 max 25,629 / sum 31 万，比跑通过的 T=28,999 / 37 万还小）。
      # 改 max_num_seqs 会改变调度器的批组成，从而躲开那个形状。
      # /!\ 不要改 max_num_batched_tokens 去躲 —— 它必须 >= max_model_len，
      # 而 enable_chunked_prefill 是 false，调小会让长序列没法一次 prefill。
      max_num_seqs: 24
      # Exactly one full sequence per scheduler step; lowering this silently
      # truncates captured hidden states.
      max_num_batched_tokens: 32768
      enable_prefix_caching: false
      enable_chunked_prefill: false
      gpu_memory_utilization: 0.90
      # Match the target's serving precision so the draft sees the same context
      # features during training and deployment.
      kv_cache_dtype: fp8
      index_cache_dtype: fp8
      enforce_eager: true
  draft:
    # gen-5 trains a fresh draft on the full six-million-row corpus rather than
    # appending an epoch to gen-4 (step 2600, eval AL 2.017). resume_from must be
    # null, not merely ignored: the loader only skips it because from_scratch is
    # true, and a stale path here is the kind of thing that silently becomes live
    # again when someone flips one flag.
    from_scratch: true
    resume_from: null
    # ---- Aligned with Inferact/Kimi-K3-DSpark/config.json ----
    num_layers: 5
    num_heads: 64
    num_kv_heads: 64
    head_dim: 128
    ffn_dim: 14336
    rms_norm_eps: 1.0e-5
    rope_theta: 50000.0
    rope_scaling_type: yarn
    rope_scaling_factor: 32.0
    rope_original_max_pos: 32768
    rope_beta_fast: 32.0
    rope_beta_slow: 1.0
    rope_mscale: 1.0
    rope_mscale_all_dim: 1.0
    use_aux_hidden_state: true
    use_input_layernorm_in_first_layer: true
    use_last_layernorm: true
    use_mtp_layernorm: false
    attention_bias: false
    mlp_bias: false
    dtype: bfloat16
    # ---- MLA dimensions (Inferact/Kimi-K3-DSpark) ----
    q_lora_rank: 1536
    kv_lora_rank: 512
    qk_nope_head_dim: 128
    qk_rope_head_dim: 64
    v_head_dim: 128
    # ---- DSpark-specific ----
    markov_rank: 256
    markov_head_type: vanilla
    enable_confidence_head: true
    confidence_head_with_markov: true
    mask_token_id: 163837
    block_size: 7

mooncake:
  # /!\ TCP, not RDMA. Ionic allows one RDMA client per HCA per process: the
  # second registration on a device fails with EINVAL (reproduced with
  # selfcheck/time_mooncake_pool.py --devices ionic_0 --stores 3). With seven
  # HCAs a teacher's producer pool therefore tops out at 7 x 2 GiB = 14 GiB,
  # while one batch of 128 sequences publishes about 24 GiB at this dataset's
  # mean length, so the producer can never place a whole batch and the request
  # never completes -- observed as extract_hidden timing out at 600 s with zero
  # steps done on 2026-08-24. TCP has no memory-region limit and measured
  # 2.0 GiB/s put plus 4.44 GiB/s cross-node get with eight fetchers, roughly
  # 5 s per batch against a ~44 s draft step.
  protocol: tcp
  # Empty under TCP. Only NCCL (draft gradients, intra-node) uses the HCAs, and
  # the hosts expose ionic_0..6 -- there is no ionic_7.
  device_name: ""
  enable_gpu_direct: false
  enable_hard_pin: true
  # One teacher segment holds every batch that teacher has in flight: about
  # 24 GiB per batch, 88 GiB in the 8192-token worst case, two batches per
  # replica at stream_prefetch_batches=8. Host RAM is 2.8 TB and the segment is
  # only touched lazily. The launcher overrides this per role; draft ranks get a
  # small segment because they only read.
  global_segment_size: 256GB
  # Staging buffer for the largest per-sequence payload, about 672 MiB at 8192
  # tokens x (5 aux + 1 final) x 7168 x bf16.
  local_buffer_size: 8GB
  # The default was 90 seconds. Widening it to 300 is pure fault tolerance and
  # does not affect the normal path.
  get_retry_max_wait_seconds: 300.0

quantization:
  training:
    fp8: null
    lumen_norm: true
    lumen_linear: true
    hf_attn_patch: true
  rollout_correction:
    enabled: false

dataset:
  chat_template: kimi-k3
  # The regenerated final assistant turn is K3 output; earlier assistant turns
  # are conversation history and are not part of this distillation target.
  last_turn_loss_only: "true"
  min_loss_tokens: 14
  # Rendering the ~5.9M-row gen-5 corpus is CPU-heavy; the nodes have 236 cores.
  # Pre-warm the cache with selfcheck/preprocess_dataset.py using these exact
  # arguments, otherwise the trainer pays for it after the teachers have already
  # claimed the GPUs. num_workers is the one argument not in the cache key.
  num_preprocess_workers: 120
  cache_dir: /dev/shm/lumenrl_cache
  # The complete stored response must fit; do not train on a truncated answer.
  drop_overlong: true
  # Zero selects full input_ids + dataset assistant loss mask instead of
  # generating prompt_ids for an on-policy decode.
  max_prompt_tokens: 0
  # /!\ Must be true. K3 is a preserved-thinking model and reasoning_effort only
  # supports max: apply_chat_template's thinking argument controls which channel
  # the decode starts on (<|open|>think<|sep|> versus <|open|>response<|sep|>),
  # so thinking=false pins the model on a starting point it was never trained
  # for, and reasoning_content in multi-turn history gets stripped as well.
  #
  # It was previously set false on the argument that "the think block will eat
  # the 1000-token budget and leave no response at all". Measurement does not
  # support that: K3's output has a median of only 398 tokens, and **truncation
  # is harmless for speculative distillation** (see teacher.generate_max_tokens).
  # Even with 26% of rows hitting the cap at 1024, what got capped is still
  # entirely tokens the teacher really produced, so it remains valid supervision.
  #
  # /!\ Depends on the kimi_k3_parser fix (PARSER_VERSION=6): before it,
  # _prepare_messages unconditionally stripped reasoning from non-final assistant
  # turns, so thinking=true rendered a string of empty think blocks. Old caches
  # must be invalidated through PARSER_VERSION and must not be reused.
  thinking: true

reward:
  type: function
  function: math_reward
  # gen-7 语料：gen-5 那 5,358,149 行去掉 80% 多语种，与 gen-6 的 1,264,631 行
  # 取并集，共 2,468,462 行（k3_train/build_gen7_dataset.py）。
  #
  # /!\ 去重是按 **prompt 指纹**、冲突时保留 gen-6 的那一版，不是按整行内容。
  # gen-6 的长样本不是新 prompt，而是对 gen-5 里 finish_reason == max_tokens
  # 那批**同一个 prompt** 用 32768 窗口重新生成的。按整行去重两版都会留下，于是
  # gen-5 那个被截断的答案也会被训进去 —— 这正是 4.4 节"不训截断回答"要挡的。
  # 实测丢了 946,910 行重复 prompt。
  #
  # 多语种在这份语料里回到 36.7%（含 aya 42.6%）。这是算术上的必然：gen-5 里
  # 多语种占 74.83%，去掉 80% 还剩 80 万行，而 gen-5 其余所有类别加起来才 135 万。
  # gen-6 的结论是这一块边际收益已归零（占比 74.8% -> 12.3%，多语种 benchmark
  # 反而从 102.8% 涨到 107.9%），所以这 36.7% 里有相当部分是花掉的机时。
  # 要收紧就改 build_gen7_dataset.py 的 --keep-multilingual（0.1 -> 约 24.9%，
  # 0.05 -> 约 17.2%），重建约 6 分钟 + 重跑 25 分钟预处理。
  dataset: /shared_nfs/jimguo12/lumenrl/datasets/gen7/train.jsonl

eval:
  enabled: true
  # 50, not the 10 gen-3 and gen-4 used. This run is about fifteen times longer,
  # and at 10 it would spend roughly nine hours of wall clock on ~4000 eval
  # points. 50 still yields ~800 points, which is far more curve than anyone
  # reads. Eval frequency does not touch the weights, so the curves stay
  # comparable -- they are just sampled more coarsely.
  interval: 50
  # 128, same as gen-3. In this topology the slice is sharded across the eight
  # draft ranks instead of replicated, so the old "each sample costs 1.2 GB on
  # every rank" ceiling no longer binds; 128 is kept for comparability, not
  # because of memory. Must stay a multiple of world_size * micro_batch_size.
  num_samples: 128
  micro_batch_size: 2
  # 两把尺子，同时监控。这是 gen-5 用一整轮训练换来的教训：
  #
  # gen-5 只留了"自己训练集尾部"这一把，而那份语料 74.8% 是多语种，于是训练侧
  # eval AL 涨了 37% 而服务端 MT-Bench 只涨 4%（兑现率从 89.9% 掉到 69.5%）。
  # 整轮训练没有任何信号能提示服务端的真实位置，直到跑完做 benchmark 才知道。
  #
  #   eval/*      —— 本轮训练集尾部 128 行（gen-7 分布：多语种 36.7%、编程 10.2%）
  #   eval_gen5/* —— gen-5 那 128 行原样搬过来，跨四代不变的基准
  #   eval_gen6/* —— gen-6 那 128 行，用来回答"这一轮有没有把长上下文能力换掉"
  #
  # 加 eval_gen6 的理由：gen-7 的语料把多语种从 12.3% 抬回 36.7%、编程从 20%
  # 降到 10.2%，而 gen-6 的全部价值就在长文本长代码（那一集 41.7% -> 104.5%）。
  # eval_gen5 太老、分布里 74.8% 是多语种，它涨不代表长上下文没退。所以必须有
  # 一把专门盯 gen-6 分布的尺子：**eval_gen6 掉下去就是在拿 gen-6 的成果换东西**，
  # 那时候该停下来，不要等跑完 benchmark 才知道。
  #
  # eval_gen5 的两个作用都只有续训才有：
  #   1. AL 与 gen-5 曲线上记录的 2.767 直接可比 —— 换了语料就等于换了基准，
  #      两代之间不可比，曾经有人因此把"数据更多更好的一轮 AL 更低"当成退化去查
  #   2. 开训前用 lr=0 跑两步，它的 AL 必须和 gen-5 记录的逐位一致 —— 一次验完
  #      权重导入、teacher hidden state、eval 分片三条链路（花 12 分钟，挡住的
  #      错误值好几天）
  #
  # /!\ 切片的指纹里 dataset_rows_after_preprocess 必须是 5011091，和 gen-5
  # 训练时的存活行数一致；不一致说明取的不是同一批行，尺子就白搭了。
  extra_slices:
    - path: /shared_nfs/jimguo12/lumenrl/eval/gen5_tail_128.pt
      prefix: eval_gen5
    # 32768 口径、gen-6 那份语料的尾部 128 行，dataset_rows_after_preprocess
    # = 1264628。gen-6 训练结束时它读到 2.563（起点 2.230）。
    - path: /shared_nfs/jimguo12/lumenrl/eval/gen6_tail_128.pt
      prefix: eval_gen6

checkpointing:
  # The multinode launcher overrides this onto shared persistent storage.
  checkpoint_dir: /dev/shm/checkpoints/kimi_k3_dspark_atom
  # 500, not gen-4's 100. Each save is a 33 GB write to shared NFS on the
  # critical path and takes about 55 s; at 100 steps this run's ~39k steps would
  # be ~390 saves, six hours of pure writing and 13 TB. 500 steps is ~2.2 h of
  # granularity, which is fine against a run measured in days.
  save_steps: 500
  # Keep every checkpoint of the run: ~39k steps / 500 = ~78 saves x 33 GB is
  # about 2.6 TB against 28 TB free. The eval curve decides which one to export,
  # and pruning has already cost this project a recomputation once -- a
  # suspicious stretch of curve needed step 2400 and it had been deleted.
  save_total_limit: 90
  # /!\ true, because this is the second epoch continuing the first one's
  # checkpoint_39000, not a fresh run. Set it back to false for anything that is
  # meant to start over: the trainer will otherwise pick up the newest checkpoint
  # in checkpoint_dir and continue without complaining.
  #
  # Resume restores the model, the optimizer state and scheduler.last_epoch, but
  # *not* the scheduler's total_steps -- that is rebuilt from num_training_steps
  # below, so raising it re-derives the lr curve rather than conflicting with the
  # saved one. At step 39000 of 78296 the lr comes out 4.50e-5 against the
  # 3.93e-5 the first epoch ended on: a 14.6% step up, then a cosine back down to
  # 3.93e-5 across the second epoch. Deliberately not smoothed -- a second epoch
  # entered at a fully annealed lr is what min_lr 0 produced last time, and it
  # stalled.
  #
  # Adam's moments must come across: the resume path warns that resetting them
  # costs a 40% -> 8% accuracy regression that takes thousands of steps to undo.
  #
  # /!\ draft.from_scratch stays true and is not a contradiction: it governs the
  # separate draft.resume_from import path, which stays unused. The weights come
  # from checkpoint_dir through _resume_from_checkpoint, which runs after the
  # draft is built and overwrites the random init. It loads with strict=False, so
  # check the "missing=" list in its log line is empty.
  resume: true

logger:
  wandb_enabled: false
  log_interval: 1

# 49,000 + 19,283。两个数都不是估的：
#
#   49,000  —— 续训的起点，即 checkpoint_49000（gen-6 的终点是 49,026，但
#              save_steps 是 500、没有收尾保存，所以最后 26 步没落盘。那 26 步
#              的 lr 已经在 min_lr 上，影响可以忽略，而且这个 checkpoint 正好有
#              自己的 eval 读数：2.563 / 2.972）。
#   19,283  —— selfcheck/preprocess_dataset.py 在 32768 口径下实测：2,468,462 行
#              进，2,468,457 行存活（5 行因 token id 超出 embedding 表被丢），
#              报出 num_training_steps 19283，覆盖 0..2,468,223，eval 从
#              2,468,329 开始。存活行长度 mean 2666 / p50 1478 / p90 6318 /
#              p99 15664 / max 32734。
#
# /!\ 不要用 行数//128 反推这个值 —— 那样不扣 eval 尾部，会差一步。
#
# /!\ 换语料就必须重测。这个数还负责把采样器挡在 eval 尾部之外
# （_trainable_len）；给大了就会训到自己的 eval 切片上，表现是 eval 指标某一步
# 突然变好，这个项目栽过一次。
num_training_steps: 68283
seed: 42

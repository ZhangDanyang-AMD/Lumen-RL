# Isaac-Cartpole-Direct-v0 on hipPhysics, 4096 envs.
# Isaac Lab v2.3.0 direct/cartpole/agents/rl_games_ppo_cfg.yaml (max_epochs 150).
# Train: python -m lumenrl.trainer.main --config configs/cartpole.yaml (environment from run_bench_cartpole.sh)
algorithm:
  name: ppo
  adv_estimator: gae_vec_env
  ppo:
    discount: 0.99
    gae_lambda: 0.95
    clip_ratio: 0.2
    num_ppo_epochs: 8
    kl_coeff: 0.0
vec_env:
  enabled: true
  plugin: isaaclab_plugin
  task: cartpole
  num_envs: 4096
  horizon: 32
  minibatch_size: 16384
  learning_rate: 5.0e-4
  desired_kl: 0.008
  kl_schedule: epoch
  normalize_input: true
  reward_scale: 0.1
  bounds_coef: 1.0e-4
  env_kwargs:
    action_clip: 1.0
num_training_steps: 150
seed: 42

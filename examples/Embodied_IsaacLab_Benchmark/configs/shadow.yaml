# Isaac-Repose-Cube-Shadow-Direct-v0 on hipPhysics, 8192 envs.
# Isaac Lab v2.3.0 direct/shadow_hand/agents/rl_games_ppo_cfg.yaml (max_epochs 5000).
algorithm:
  name: ppo
  adv_estimator: gae_vec_env
  ppo:
    discount: 0.99
    gae_lambda: 0.95
    clip_ratio: 0.2
    num_ppo_epochs: 5
    kl_coeff: 0.0
vec_env:
  enabled: true
  plugin: isaaclab_plugin
  task: shadow
  num_envs: 8192
  horizon: 16
  minibatch_size: 32768
  learning_rate: 5.0e-4
  desired_kl: 0.016
  kl_schedule: epoch
  normalize_input: true
  normalize_value: true
  reward_scale: 0.01
  bounds_coef: 1.0e-4
  env_kwargs:
    action_clip: 1.0
num_training_steps: 5000
seed: 42

# GPT-OSS-120B Eagle3 SDDD — Phase 1: Short Context (≤4096 tokens)
#
# Two-phase training aligned with NVIDIA Eagle3-v3 approach:
#   Phase 1: Large-scale short-context distillation (~2.7M Nemotron PTv3 prompts)
#   Phase 2: Long-context fine-tuning (~200K long prompts)
#
# Continues from v1 checkpoint_15800 (step 15800, accept_length=1.88)
# to leverage existing training progress with better data.
#
# Key parameters aligned with Model-Optimizer eagle3.yaml defaults:
#   eagle_ttt_steps: 3          → spec_length: 3
#   eagle_loss_decay_factor: 0.9 → position_decay: 0.9
#   learning_rate: 1e-4         → learning_rate: 1e-4
#   warmup_steps: 1000          → warmup_ratio computed from total steps
#   lr_scheduler_type: linear   → lr_decay_style: linear
#   num_train_epochs: 1         → num_training_steps computed from dataset size
#
# On-policy data flow:
#   1. Prompt-only dataset: Nemotron PTv3 phase1_short.jsonl
#   2. vLLM teacher generates responses (greedy, max 4096 tokens)
#   3. Hidden states captured on full sequence (prompt + generated)
#   4. Draft head trains on teacher's own hidden states
#
# Disaggregated architecture (vLLM + Mooncake TCP):
#   GPUs 0-3: FSDP2 Eagle3 draft model training (BF16, Lumen + aiter)
#   GPUs 4-7: vLLM teacher inference (TP=4, BF16, FP8 KV cache)

cluster:
  gpus_per_node: 4
  num_nodes: 1

policy:
  model_name: /dev/shm/gpt-oss-120b
  training_backend: fsdp2
  generation_backend: hf
  max_total_sequence_length: 4096
  train_global_batch_size: 32
  train_micro_batch_size: 1
  learning_rate: 1e-4
  weight_decay: 0.0
  max_grad_norm: 1.0
  # warmup_steps=1000. Exact ratio depends on dataset size.
  # ~2.7M / 32 = ~84375 steps → 1000/84375 ≈ 0.012
  warmup_ratio: 0.012
  lr_decay_style: linear

algorithm:
  name: spec_distill
  spec_distill:
    draft_type: eagle3
    loss_type: forward_kl
    position_decay: 0.9
    num_target_layers: 1
    spec_length: 3
    aux_hidden_state_layer_ids: [2, 18, 33, 36]
    separate_last_hidden: true
    shift_input_embeds: true
  teacher:
    model_name: /dev/shm/gpt-oss-120b
    inference_backend: vllm
    tensor_parallel_size: 4
    gpu_ids: [4, 5, 6, 7]
    quantization: ""
    generate_mode: generate
    generate_max_tokens: 4096
    generate_temperature: 0.0
  draft:
    from_scratch: false
    resume_from: /dev/shm/checkpoints/gpt_oss_120b_eagle3_vllm
    num_layers: 1
    num_heads: 64
    num_kv_heads: 8
    head_dim: 64
    ffn_dim: 17280
    rms_norm_eps: 1.0e-5
    rope_theta: 500000.0
    rope_scaling_type: llama3
    rope_scaling_factor: 8.0
    rope_original_max_pos: 8192
    rope_low_freq_factor: 1.0
    rope_high_freq_factor: 4.0
    use_aux_hidden_state: true
    use_input_layernorm_in_first_layer: true
    use_last_layernorm: true
    use_mtp_layernorm: false
    attention_bias: false
    mlp_bias: false
    dtype: bfloat16

mooncake:
  protocol: tcp
  device_name: ""
  global_segment_size: 16GB
  local_buffer_size: 4GB

quantization:
  training:
    fp8: null
  rollout_correction:
    enabled: false

dataset:
  chat_template: hf-generation
  last_turn_loss_only: false
  min_loss_tokens: -1
  num_preprocess_workers: 16
  cache_dir: /dev/shm/lumenrl_cache

reward:
  type: function
  function: math_reward
  dataset: /dev/shm/gpt_oss_120b_dataset_v3/phase1_short.jsonl
  dataset_split: train

eval:
  enabled: false
  interval: 1000
  num_samples: 256
  micro_batch_size: 8

checkpointing:
  checkpoint_dir: /dev/shm/checkpoints/gpt_oss_120b_eagle3_v3_phase1
  save_steps: 500
  save_total_limit: 3
  resume: true

logger:
  wandb_enabled: false
  log_interval: 1

# ~2.7M prompts / global_bs=32 ≈ 84,375 steps/epoch.
# NV default: num_train_epochs=1.
# Actual step count depends on Phase 1 dataset size after filtering.
# This will be overridden at launch time based on actual dataset size.
num_training_steps: 84375
seed: 42

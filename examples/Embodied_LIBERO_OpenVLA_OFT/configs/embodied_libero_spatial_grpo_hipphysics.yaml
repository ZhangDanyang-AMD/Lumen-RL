# GRPO for OpenVLA-OFT on LIBERO-Spatial with hipPhysics: physics, OSC control and the
# 256x256 agent-view camera run on the GPU (8 worlds of one task per engine).
#
#   HP_REPO=/work/hipphysics/src HP_BUILD=/work/hipphysics/build-libero \
#   CONFIG=examples/Embodied_LIBERO_OpenVLA_OFT/configs/embodied_libero_spatial_grpo_hipphysics.yaml \
#   bash examples/Embodied_LIBERO_OpenVLA_OFT/run_embodied_grpo.sh

embodied:
  enabled: true
  plugin: examples.Embodied_LIBERO_OpenVLA_OFT.plugin
  policy:
    model_type: openvla_oft
    model_path: /work/models/Openvla-oft-SFT-libero-spatial-traj1
    unnorm_key: libero_spatial_no_noops
    gradient_checkpointing: true
    freeze_vision_backbone: false
  env:
    backend: hipphysics_libero
    task_suite: libero_spatial
    max_episode_steps: 220
    camera_height: 256
    camera_width: 256
    num_steps_wait: 10
    worlds_per_lane: 8
  rollout:
    backend: hf
    temperature: 1.6
    batch_size: 16
    groups_per_rank: 2
    recompute_old_log_probs: true
    filter_zero_advantage_groups: true
  train_micro_batch_size: 8
  entropy_coeff: 0.0
  log_dir: /work/runs/libero_spatial_grpo_hipphysics
  save_interval: 10
  keep_checkpoints: 2
  save_dir: /work/runs/libero_spatial_grpo_hipphysics/checkpoints
  lumen:
    actor:
      scaling: "none"
      lumen_norm: true
      lumen_linear: true

policy:
  model_name: /work/models/Openvla-oft-SFT-libero-spatial-traj1
  training_backend: fsdp2
  learning_rate: 5.0e-6
  lr_warmup_steps: 0
  lr_decay_style: constant
  weight_decay: 0.0
  max_grad_norm: 1.0
  adam_beta1: 0.9
  adam_beta2: 0.999

algorithm:
  name: grpo
  clip_ratio_high: 0.28
  loss_agg_mode: token-mean
  grpo:
    num_generations: 8
    kl_coeff: 0.0
    clip_ratio: 0.2
    num_ppo_epochs: 1
    num_mini_batches: 2

logger:
  wandb_enabled: false
  log_interval: 1

num_training_steps: 100
seed: 42

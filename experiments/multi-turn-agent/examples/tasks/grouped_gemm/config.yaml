source_file_path:
  - kernel.py
target_kernel_functions:
  - _grouped_gemm_kernel
compile_command:
  - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-1} python3 scripts/task_runner.py compile
correctness_command:
  - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-1} python3 scripts/task_runner.py correctness
performance_command:
  - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-1} python3 scripts/task_runner.py performance
task_type: triton2triton
prompt:
  instructions: Optimize a single-launch grouped GEMM with deterministic skewed routed-token counts.

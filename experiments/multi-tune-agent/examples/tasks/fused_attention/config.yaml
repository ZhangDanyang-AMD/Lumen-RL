source_file_path:
  - kernel.py
target_kernel_functions:
  - _fused_attention_kernel
compile_command:
  - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-1} python3 scripts/task_runner.py compile
correctness_command:

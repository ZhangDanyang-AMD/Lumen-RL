source_file_path:
  - kernel.py
target_kernel_functions:
  - _fp8_a8w8_gemm_kernel
compile_command:
  - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-1} python3 scripts/task_runner.py compile
correctness_command:
  - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-1} python3 scripts/task_runner.py correctness
performance_command:
  - HIP_VISIBLE_DEVICES=${HIP_VISIBLE_DEVICES:-1} python3 scripts/task_runner.py performance
task_type: triton2triton
prompt:
  instructions: Optimize gfx942 FP8 E4M3 FNUZ A8W8 dense GEMM with per-token activation scales, per-output-channel weight scales, FP32 accumulation/scaling, and FP16 output.

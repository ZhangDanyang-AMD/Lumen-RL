schema_version: geak_phase1_case_candidates_v1
source_revisions:
  aiter:
    repository: https://github.com/ROCm/aiter.git
    branch: main
    git_sha: 926eb3d059efd3c866c8f53ecb8b1fb8fb7135e8
    license: MIT
    local_root: /home/danyzhan/aiter
  geak:
    repository: https://github.com/AMD-AGI/GEAK.git
    branch: main
    git_sha: fa86fd1e9bec56dadf27d6575a0c8f8ab7875c57
    local_root: /home/danyzhan/GEAK
  lumen_rl:
    repository: https://github.com/ZhangDanyang-AMD/Lumen-RL.git
    branch: dev/multi-loop-agent
    git_sha: 2f255d5c898e215d3bea8fa100829214c61e87f9
    local_root: /home/danyzhan/Lumen-RL
policy:
  candidate_is_runnable: false
  student_runtime_may_call_reference_backend: false
  cross_language_contract_reuse_allowed: true
  translated_implementations_share_family: true
  same_shape_does_not_create_new_lineage: true
  require_source_file_sha256_before_seed_promotion: true
  require_split_group_before_batch_generation: true
  require_target_gpu_smoke_before_validated_case: true
  require_fresh_workspace_independent_verify: true
status_flow:
- extracted_candidate
- registered_seed
- validated_case
defaults:
  status: extracted_candidate
  implementation_family_id: pending_independent_baseline
  split_group: pending_split_freeze
  source_file_sha256: pending_seed_promotion
  promotion_requires:
  - source_file_sha256
  - standalone_geak_harness
  - no_reference_runtime_call
  - target_gpu_compile_correctness_performance
  - frozen_split_group
  - fresh_workspace_independent_verify

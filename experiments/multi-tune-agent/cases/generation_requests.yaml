version: 1
requests:
  - id: mi308-gemm-m1-n128-k128-fp16
    request: >
      在 MI308 上生成 GEMM kernel，MNK 分别为 1/128/128，
      FP16 输入、FP16 权重、FP16 输出，使用 Triton。

  - id: mi308-gemm-m1-n128-k128-fp8
    request: >
      在 MI308 上生成 FP8 A8W8 GEMM kernel，MNK 分别为 1/128/128，
      activation 使用 per-token FP32 scale，weight 使用 per-output-channel
      FP32 scale，FP32 累加与缩放，FP16 输出，使用 Triton。

  - id: mi350-gemm-m1-n128-k128-mxfp8
    request: >
      在 MI350 上生成原生 MXFP8 GEMM kernel，MNK 分别为 1/128/128，
      activation 和 weight 使用 per-block scale，block size 为 32，
      BF16 输出，使用 FlyDSL。
